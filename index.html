<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>BOXING GAME 2.2</title>
<style>
:root{--bg:#070a0f;--panel:#121923;--line:#303b49;--text:#f5f7fa;--muted:#98a5b4;--red:#ff4d52;--blue:#3d8bfd;--green:#39cf82;--gold:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{width:100%;height:100%;display:flex;justify-content:center;background:radial-gradient(circle at 50% 8%,#1b2532 0,#080b10 58%)}
.screen{width:min(100%,780px);height:100%;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:10px}
.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:950;letter-spacing:2px;font-size:18px}.badge{font-size:10px;color:#b8c2cd;border:1px solid #3a4654;border-radius:999px;padding:5px 8px}
.btn{min-height:52px;border-radius:14px;background:#202a36;border:1px solid #3a4654;font-weight:850}.btn.primary{background:var(--red);border-color:#ff7074}.btn.secondary{background:#182435}.btn:active,.controls button:active{transform:scale(.98);filter:brightness(1.12)}
.home{justify-content:center}.logo{text-align:center;font-size:48px;font-weight:1000;letter-spacing:4px}.subtitle{text-align:center;color:var(--muted);margin-top:4px}.menu{display:grid;gap:10px;margin-top:18px}.small{text-align:center;color:var(--muted);font-size:12px;line-height:1.55}
.panel{background:rgba(18,25,35,.96);border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 45px #0008}.section{padding:14px}.section h2{font-size:17px;margin:0 0 11px}.choices{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.choice{min-width:76px;height:48px;border-radius:11px;background:#1b2430;border:1px solid #3b4654;font-size:12px}.choice.active{outline:2px solid var(--red)}.stat{margin:10px 0}.statline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.range{width:100%;accent-color:var(--red)}
.preview{height:170px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;background:linear-gradient(#141d29,#0d1219);border-radius:14px}.preview:after{content:"";position:absolute;left:0;right:0;bottom:22px;height:2px;background:#4a5664}.fighter{position:relative;width:92px;height:150px;z-index:2}.fighter .head{position:absolute;left:22px;top:3px;width:48px;height:48px;border-radius:50%;background:#b87552}.fighter .hair{position:absolute;left:20px;top:0;width:52px;height:24px;border-radius:26px 26px 10px 10px;background:#241b19;z-index:3}.fighter .body{position:absolute;left:12px;top:44px;width:68px;height:75px;border-radius:27px 27px 14px 14px;background:#2e75cf}.fighter .shorts{position:absolute;left:11px;top:111px;width:70px;height:39px;border-radius:7px;background:#242a33}.fighter .arm{position:absolute;top:51px;width:22px;height:65px;border-radius:15px;background:#b87552}.fighter .arm.l{left:-3px;transform:rotate(15deg)}.fighter .arm.r{right:-3px;transform:rotate(-15deg)}.fighter .leg{position:absolute;top:137px;width:25px;height:45px;border-radius:14px;background:#b87552}.fighter .leg.l{left:18px}.fighter .leg.r{right:18px}
.fight{padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}.hud{display:grid;grid-template-columns:1fr 66px 1fr;align-items:end;gap:8px}.name{font-size:11px;color:var(--muted);margin-bottom:4px}.name.right{text-align:right}.bar{height:14px;background:#28313c;border-radius:99px;overflow:hidden;border:1px solid #3a4653}.fill{height:100%;transition:width .12s}.hpP{background:var(--green)}.hpE{background:var(--red)}.stamina{height:5px;margin-top:4px;background:#26303a;border-radius:99px;overflow:hidden}.stamina>div{height:100%;background:var(--gold);transition:width .12s}.timer{text-align:center;font-size:23px;font-weight:950;line-height:1}.round{text-align:center;color:var(--muted);font-size:10px;margin-top:4px;letter-spacing:1px}
.ring{position:relative;flex:1;min-height:300px;border-radius:17px;overflow:hidden;border:1px solid #3b4654;background:linear-gradient(#202b3a 0 47%,#151d27 47% 100%);box-shadow:inset 0 0 80px #0008}.lights{position:absolute;left:0;right:0;top:0;height:47%;background:radial-gradient(ellipse at 50% 25%,#ffffff22 0,#ffffff00 55%)}.crowd{position:absolute;left:0;right:0;top:15%;height:30%;opacity:.25;background:radial-gradient(circle at 10% 55%,#fff 0 2px,transparent 3px),radial-gradient(circle at 18% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 28% 65%,#fff 0 2px,transparent 3px),radial-gradient(circle at 39% 40%,#fff 0 2px,transparent 3px),radial-gradient(circle at 50% 62%,#fff 0 2px,transparent 3px),radial-gradient(circle at 62% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 73% 60%,#fff 0 2px,transparent 3px),radial-gradient(circle at 84% 38%,#fff 0 2px,transparent 3px),radial-gradient(circle at 94% 63%,#fff 0 2px,transparent 3px)}
.canvasFloor{position:absolute;left:0;right:0;bottom:0;height:53%;background:linear-gradient(#1b2530,#10161e);transform:perspective(500px) rotateX(8deg);transform-origin:bottom}.canvasFloor:after{content:"";position:absolute;inset:15% 8% 7%;border:2px solid #aeb6be55;box-shadow:0 0 0 1px #0004}.ropes{position:absolute;left:0;right:0;top:47%;height:35px;z-index:3;border-top:3px solid #e1e5e9;border-bottom:3px solid #858e98;box-shadow:0 9px 0 -6px #c0c6cc}.corner{position:absolute;top:42%;width:10px;height:105px;background:#9ba3ab;z-index:4}.corner.l{left:8%}.corner.r{right:8%}
.boxer{position:absolute;bottom:14%;width:86px;height:165px;z-index:8;transition:left .16s,bottom .16s,transform .12s}.boxer.player{left:16%}.boxer.enemy{left:70%;transform:scaleX(-1)}.boxer .head{position:absolute;left:22px;top:0;width:42px;height:42px;border-radius:50%;background:#b87552;z-index:4}.boxer .hair{position:absolute;left:19px;top:-1px;width:47px;height:21px;border-radius:24px 24px 8px 8px;background:#241b19;z-index:5}.boxer .body{position:absolute;left:11px;top:39px;width:64px;height:72px;border-radius:24px 24px 12px 12px;background:#2e75cf}.boxer.enemy .body{background:#b72f39}.boxer .shorts{position:absolute;left:11px;top:104px;width:64px;height:39px;border-radius:7px;background:#20262f}.boxer .arm{position:absolute;top:48px;width:19px;height:61px;border-radius:13px;background:#b87552;z-index:3;transform-origin:top center;transition:transform .1s}.boxer .arm.l{left:2px}.boxer .arm.r{right:2px}.boxer .glove{position:absolute;width:23px;height:23px;border-radius:50%;background:var(--red);bottom:-8px;left:-2px}.boxer.enemy .glove{background:var(--blue)}.boxer .leg{position:absolute;top:139px;width:21px;height:48px;border-radius:13px;background:#b87552}.boxer .leg.l{left:20px}.boxer .leg.r{right:20px}.boxer.guard .arm.l{transform:rotate(62deg)}.boxer.guard .arm.r{transform:rotate(-62deg)}.boxer.weave{bottom:20%}.boxer.duck{bottom:11%;transform:scaleY(.82) scaleX(1)}.boxer.enemy.duck{transform:scaleY(.82) scaleX(-1)}.boxer.punch{transform:translateX(24px) scale(1.04)}.boxer.enemy.punch{transform:translateX(-24px) scale(1.04)}.boxer.jab .arm.r{animation:jabR .28s ease-out}.boxer.jab .arm.l{animation:jabL .28s ease-out}.boxer.straight .arm.r{animation:straightR .34s ease-out}.boxer.straight .arm.l{animation:straightL .34s ease-out}.boxer.hook .arm.r{animation:hookR .38s ease-out}.boxer.hook .arm.l{animation:hookL .38s ease-out}.boxer.upper .arm.r{animation:upperR .4s ease-out}.boxer.upper .arm.l{animation:upperL .4s ease-out}.boxer.hurt{animation:hurt .28s ease}.boxer .glove{box-shadow:0 2px 5px #0006}.boxer.jab .glove,.boxer.straight .glove,.boxer.hook .glove,.boxer.upper .glove{box-shadow:0 0 14px #fff5}@keyframes jabR{0%{transform:rotate(-15deg)}45%{transform:translate(40px,3px) rotate(-4deg)}100%{transform:rotate(-15deg)}}@keyframes jabL{0%{transform:rotate(15deg)}45%{transform:translate(40px,3px) rotate(4deg)}100%{transform:rotate(15deg)}}@keyframes straightR{0%{transform:rotate(-15deg)}35%{transform:translate(53px,0) rotate(-2deg)}70%{transform:translate(53px,0) rotate(-2deg)}100%{transform:rotate(-15deg)}}@keyframes straightL{0%{transform:rotate(15deg)}35%{transform:translate(53px,0) rotate(2deg)}70%{transform:translate(53px,0) rotate(2deg)}100%{transform:rotate(15deg)}}@keyframes hookR{0%{transform:rotate(-15deg)}35%{transform:translate(26px,10px) rotate(-95deg)}65%{transform:translate(36px,-2px) rotate(-55deg)}100%{transform:rotate(-15deg)}}@keyframes hookL{0%{transform:rotate(15deg)}35%{transform:translate(26px,10px) rotate(95deg)}65%{transform:translate(36px,-2px) rotate(55deg)}100%{transform:rotate(15deg)}}@keyframes upperR{0%{transform:rotate(-15deg)}35%{transform:translate(28px,-8px) rotate(-70deg)}65%{transform:translate(40px,-25px) rotate(-35deg)}100%{transform:rotate(-15deg)}}@keyframes upperL{0%{transform:rotate(15deg)}35%{transform:translate(28px,-8px) rotate(70deg)}65%{transform:translate(40px,-25px) rotate(35deg)}100%{transform:rotate(15deg)}}@keyframes hurt{0%{transform:translateX(0) rotate(0)}30%{transform:translateX(13px) rotate(4deg)}60%{transform:translateX(-6px) rotate(-2deg)}100%{transform:translateX(0) rotate(0)}}.shadow{position:absolute;bottom:11%;width:90px;height:17px;border-radius:50%;background:#0008;filter:blur(5px);z-index:5}.shadow.p{left:14%}.shadow.e{left:69%}
.status{height:22px;text-align:center;font-size:12px;color:#aeb8c4;line-height:22px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.controls button{min-height:44px;border-radius:11px;background:#202a36;border:1px solid #3a4654;font-size:11px;font-weight:900}.controls .atk{background:#642c33}.controls .def{background:#203e61}.controls .move{background:#28322f}.controls .special{background:#4c3b21}.hint{text-align:center;font-size:10px;color:#7f8b98}
.result{position:absolute;inset:0;z-index:30;background:#05080dcc;display:flex;align-items:center;justify-content:center}.resultBox{width:86%;padding:28px 20px;border-radius:20px;text-align:center;background:#121923;border:1px solid #3c4856;box-shadow:0 20px 70px #000}.resultBox h1{font-size:38px;margin:0 0 8px}.resultBox p{margin:0 0 18px;color:var(--muted);line-height:1.5}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25;pointer-events:none}.flash.on{animation:flash .15s}@keyframes flash{0%{opacity:.55}100%{opacity:0}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const state={skin:'#b87552',hair:'#241b19',height:1,weight:70,power:60,speed:60,step:60,tough:60,playerHP:100,enemyHP:100,playerSt:100,enemySt:100,time:180,running:false,guard:false,dodgeUntil:0,playerX:16,enemyX:70,lastAction:0};
const $=id=>document.getElementById(id);
const attacks={jab:{d:7,cost:7,range:21,cd:330},straight:{d:10,cost:9,range:23,cd:450},hook:{d:12,cost:12,range:20,cd:520},upper:{d:15,cost:15,range:18,cd:650}};
function renderHome(){app.innerHTML=`<main class="screen home"><div class="top"><div class="brand">BOXING GAME</div><span class="badge">PROTOTYPE 2.2</span></div><div><div class="logo">🥊 BOXING</div><div class="subtitle">Mobile Boxing Prototype</div></div><div class="menu"><button class="btn primary" onclick="startFight()">경기 시작</button><button class="btn secondary" onclick="renderCustom()">내 복서 만들기</button></div><div class="small">아이폰 터치 조작 · 오프라인 싱글 플레이<br>2.2 : 펀치 모션 · 피격 모션 · 링 · 체력 · 스태미나 · 가드 · 회피 · 스텝 · CPU</div></main>`}
function renderCustom(){app.innerHTML=`<main class="screen"><div class="top"><div class="brand">MY BOXER</div><button class="btn" style="min-height:38px;padding:0 13px" onclick="renderHome()">뒤로</button></div><div class="preview panel"><div class="fighter" style="transform:scaleY(${state.height})"><div class="hair" style="background:${state.hair}"></div><div class="head" style="background:${state.skin}"></div><div class="body"></div><div class="arm l" style="background:${state.skin}"></div><div class="arm r" style="background:${state.skin}"></div><div class="shorts"></div><div class="leg l" style="background:${state.skin}"></div><div class="leg r" style="background:${state.skin}"></div></div></div><section class="panel section"><h2>피부색</h2><div class="choices">${['#7a4934','#9a5e43','#b87552','#d29570','#edb895'].map((c,i)=>`<button class="choice ${state.skin===c?'active':''}" style="background:${c}" onclick="state.skin='${c}';renderCustom()">${['진한색','갈색','중간','밝은색','아주 밝은색'][i]}</button>`).join('')}</div><h2 style="margin-top:16px">헤어</h2><div class="choices">${['#171717','#3b2418','#7b4b2a','#d2a03c','#d8d8d8'].map((c,i)=>`<button class="choice ${state.hair===c?'active':''}" style="background:${c}" onclick="state.hair='${c}';renderCustom()">${['숏컷','갈색','브라운','블론드','실버'][i]}</button>`).join('')}</div><div class="stat"><div class="statline"><span>키</span><b>${Math.round(160+state.height*25)} cm</b></div><input class="range" type="range" min=".85" max="1.15" step=".01" value="${state.height}" oninput="state.height=+this.value;renderCustom()"></div><div class="stat"><div class="statline"><span>체급</span><b>${state.weight} kg</b></div><input class="range" type="range" min="50" max="100" value="${state.weight}" oninput="state.weight=+this.value;renderCustom()"></div></section><section class="panel section"><h2>능력치</h2>${[['power','주먹 파워'],['speed','주먹 속도'],['step','스텝 속도'],['tough','맷집']].map(x=>`<div class="stat"><div class="statline"><span>${x[1]}</span><b>${state[x[0]]}</b></div><input class="range" type="range" min="0" max="100" value="${state[x[0]]}" oninput="state['${x[0]}']=+this.value;renderCustom()"></div>`).join('')}</section><button class="btn primary" onclick="startFight()">이 복서로 경기하기</button></main>`}
function startFight(){state.playerHP=100;state.enemyHP=100;state.playerSt=100;state.enemySt=100;state.time=180;state.running=true;state.guard=false;state.dodgeUntil=0;state.playerX=16;state.enemyX=70;state.lastAction=0;renderFight();last=performance.now();acc=0;cpuAcc=0;requestAnimationFrame(gameLoop)}
function renderFight(){app.innerHTML=`<main class="screen fight"><div class="hud"><div><div class="name">PLAYER</div><div class="bar"><div id="php" class="fill hpP" style="width:100%"></div></div><div class="stamina"><div id="pst" style="width:100%"></div></div></div><div><div id="timer" class="timer">3:00</div><div class="round">ROUND 1</div></div><div><div class="name right">CPU</div><div class="bar"><div id="ehp" class="fill hpE" style="width:100%"></div></div><div class="stamina"><div id="est" style="width:100%"></div></div></div></div><div id="ring" class="ring"><div class="lights"></div><div class="crowd"></div><div class="canvasFloor"></div><div class="ropes"></div><div class="corner l"></div><div class="corner r"></div><div class="shadow p"></div><div class="shadow e"></div><div id="player" class="boxer player"><div class="hair" style="background:${state.hair}"></div><div class="head" style="background:${state.skin}"></div><div class="body"></div><div class="arm l" style="background:${state.skin}"><div class="glove"></div></div><div class="arm r" style="background:${state.skin}"><div class="glove"></div></div><div class="shorts"></div><div class="leg l" style="background:${state.skin}"></div><div class="leg r" style="background:${state.skin}"></div></div><div id="enemy" class="boxer enemy"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm l"><div class="glove"></div></div><div class="arm r"><div class="glove"></div></div><div class="shorts"></div><div class="leg l"></div><div class="leg r"></div></div><div id="flash" class="flash"></div><div id="result" class="result hidden"><div class="resultBox"><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" onclick="renderHome()">메인으로</button></div></div></div><div id="status" class="status">거리를 좁혀 공격하세요</div><div class="controls"><button class="atk" onclick="attack('jab')">👊 JAB</button><button class="atk" onclick="attack('straight')">👊 STRAIGHT</button><button class="atk" onclick="attack('hook')">🥊 HOOK</button><button class="atk" onclick="attack('upper')">🥊 UPPER</button><button class="def" onclick="guard()">🛡️ GUARD</button><button class="def" onclick="dodge('weave')">↙ WEAVE</button><button class="def" onclick="dodge('duck')">↓ DUCK</button><button class="special" onclick="parry()">⚡ PARRY</button><button class="move" onclick="move(-1,false)">← WALK</button><button class="move" onclick="move(1,false)">WALK →</button><button class="move" onclick="move(-1,true)">↞ DASH</button><button class="move" onclick="move(1,true)">DASH ↠</button></div><div class="hint">공격은 거리 안에서만 적중 · 스태미나가 부족하면 공격이 약해집니다</div><button class="btn" style="min-height:38px" onclick="quitFight()">경기 나가기</button></main>`}
function setStatus(t){const s=$('status');if(s)s.textContent=t}
function dist(){return Math.abs(state.enemyX-state.playerX)}
function update(){if(!$('php'))return;$('php').style.width=state.playerHP+'%';$('ehp').style.width=state.enemyHP+'%';$('pst').style.width=state.playerSt+'%';$('est').style.width=state.enemySt+'%';const sec=Math.max(0,state.time);$('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('player').style.left=state.playerX+'%';$('enemy').style.left=state.enemyX+'%'}
function animate(cls,ms=180){const p=$('player');if(!p)return;p.classList.remove('punch','jab','straight','hook','upper',cls);void p.offsetWidth;p.classList.add(cls);if(cls!=='punch')p.classList.add('punch');setTimeout(()=>p.classList.remove(cls,'punch'),ms)}
function attack(type){if(!state.running)return;const a=attacks[type],now=performance.now();if(now-state.lastAction<a.cd)return setStatus('아직 공격이 준비되지 않았습니다');if(state.playerSt<a.cost)return setStatus('스태미나 부족!');state.lastAction=now;state.playerSt=Math.max(0,state.playerSt-a.cost);animate(type,420);if(dist()>a.range)return setStatus(type.toUpperCase()+'! 빗나갔습니다 — 거리가 멉니다');if(Math.random()<0.1+state.enemySt/1000)return setStatus('상대가 회피했습니다!');let damage=Math.round(a.d*(.65+state.power/100)*(.8+state.weight/100));if(Math.random()<.1){damage=Math.round(damage*1.5);setStatus('🔥 크리티컬! -'+damage)}else setStatus(type.toUpperCase()+' 적중! -'+damage);state.enemyHP=Math.max(0,state.enemyHP-damage);const e=$('enemy');e.classList.add('hurt');setTimeout(()=>e.classList.remove('hurt'),220);flash();if(state.enemyHP<=0)endFight(true)}
function guard(){if(!state.running)return;state.guard=true;const p=$('player');p.classList.add('guard');setStatus('🛡️ 가드 중 — 다시 누르면 해제');setTimeout(()=>{if(state.running){state.guard=false;p.classList.remove('guard')}},900)}
function dodge(type){if(!state.running)return;state.dodgeUntil=performance.now()+520;const p=$('player');p.classList.remove('weave','duck');p.classList.add(type);setStatus(type==='weave'?'↙ 위빙!':'↓ 더킹!');setTimeout(()=>{if(p)p.classList.remove(type)},520)}
function parry(){if(!state.running)return;state.dodgeUntil=performance.now()+280;state.guard=true;setStatus('⚡ 패링 준비! 상대 공격 타이밍에 맞춰 사용하세요');const p=$('player');p.classList.add('guard');setTimeout(()=>{state.guard=false;if(p)p.classList.remove('guard')},280)}
function move(dir,dash){if(!state.running)return;const amount=(dash?8:3.5)*(0.75+state.step/100);state.playerX=Math.max(7,Math.min(77,state.playerX+dir*amount));setStatus(dash?'↠ 대시 스텝!':'스텝!');update()}
function cpu(){if(!state.running)return;const d=dist();if(d>24){state.enemyX+=(state.playerX>state.enemyX?1:-1)*2.4;setStatus('상대가 접근합니다');return}if(Math.random()<.22){state.enemyX+=(Math.random()>.5?1:-1)*3;setStatus('상대가 스텝을 밟습니다');return}const type=['jab','straight','hook'][Math.floor(Math.random()*3)],a=attacks[type];state.enemySt=Math.max(0,state.enemySt-a.cost);const p=$('player');p.classList.remove('punch','jab','straight','hook','upper');void p.offsetWidth;p.classList.add(type,'punch');setTimeout(()=>p&&p.classList.remove(type,'punch'),420);if(performance.now()<state.dodgeUntil){setStatus('✨ 상대 공격 회피!');return}if(state.guard){if(Math.random()<.65){const counter=Math.round(4+state.power*.06);state.enemyHP=Math.max(0,state.enemyHP-counter);setStatus('⚡ 패링/가드 성공! 반격 -'+counter);flash()}else{const d2=Math.max(1,Math.round((a.d*.5)*(1-state.tough/180)));state.playerHP=Math.max(0,state.playerHP-d2);setStatus('가드했지만 충격을 받았습니다 -'+d2)}return}let damage=Math.round(a.d*(.75+Math.random()*.35)*(1.05-state.tough/220));state.playerHP=Math.max(0,state.playerHP-damage);p.classList.add('hurt');setTimeout(()=>p.classList.remove('hurt'),220);setStatus('상대 '+type.toUpperCase()+'! -'+damage);flash();if(state.playerHP<=0)endFight(false)}
function flash(){const f=$('flash');if(!f)return;f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function endFight(win){if(!state.running)return;state.running=false;const r=$('result');if(!r)return;r.classList.remove('hidden');$('resultTitle').textContent=win?'VICTORY':'DEFEAT';$('resultText').textContent=win?'상대의 체력을 모두 소진시켰습니다!':'체력이 모두 소진되었습니다. 다시 도전해보세요.';update()}
function quitFight(){state.running=false;renderHome()}
let last=0,acc=0,cpuAcc=0,regenAcc=0;
function gameLoop(ts){if(!state.running)return;const dt=(ts-last)/1000;last=ts;acc+=dt;cpuAcc+=dt;regenAcc+=dt;if(acc>=1){state.time--;acc=0;if(state.time<=0){endFight(state.playerHP>state.enemyHP);return}}if(regenAcc>=.25){regenAcc=0;state.playerSt=Math.min(100,state.playerSt+1.8);state.enemySt=Math.min(100,state.enemySt+1.5)}if(cpuAcc>1.0+Math.random()*.6){cpuAcc=0;cpu()}update();requestAnimationFrame(gameLoop)}
renderHome();
</script>
</body>
