<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BOXING GAME 4.8</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#080d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(960px,100%);height:100%;margin:auto;padding:10px 12px 16px;display:flex;flex-direction:column}.hud{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;align-items:end}.name{font-weight:800;color:#b8c3d1}.right{text-align:right}.meter{height:18px;background:#263342;border:1px solid #526276;border-radius:99px;overflow:hidden;margin-top:5px}.hp{height:100%;width:100%;background:#32d583}.cpuHp{background:#ef4650}.st{height:7px;background:#f2c94c;margin-top:5px;border-radius:99px;width:100%}.clock{text-align:center;font-size:34px;font-weight:950}.round{text-align:center;font-size:10px;color:#8c9bad;letter-spacing:2px}.stage{position:relative;flex:1;min-height:390px;margin:8px 0;border:2px solid #34455a;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 15%,#33465b,#172332 60%,#0b1118)}.rope{position:absolute;left:0;right:0;height:5px;background:#e9edf1cc;z-index:1}.r1{top:48%}.r2{top:58%}.r3{top:68%}.floor{position:absolute;left:0;right:0;bottom:0;height:32%;background:#0c141e;border-top:3px solid #455466}.fighter{position:absolute;bottom:8%;width:46%;height:78%;z-index:3;transition:transform .12s ease}.player{left:1%}.cpu{right:1%;transform:scaleX(-1)}.fighter svg{width:100%;height:100%;display:block;overflow:visible}.skin{fill:#c98a65}.skin2{fill:#c98a65}.shirt{fill:#2e78cf}.shirt.cpuShirt{fill:#c72f3b}.shorts{fill:#17202b}.hair{fill:#241a18}.eye{fill:#111}.mouth{fill:none;stroke:#5a2c26;stroke-width:3;stroke-linecap:round}.upper,.fore{fill:none;stroke-linecap:round;stroke-linejoin:round}.upper{stroke:#b97851;stroke-width:38}.fore{stroke:#d08b64;stroke-width:34}.joint{fill:#d08b64}.glove{fill:#ef4650;stroke:#b92934;stroke-width:3}.rearGlove{fill:#3e8cff;stroke:#246bd0;stroke-width:3}.leg{fill:none;stroke:#b97851;stroke-width:40;stroke-linecap:round}.shoe{fill:#151d27;stroke:#080b10;stroke-width:4}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.btn{min-height:50px;border:1px solid #40536a;border-radius:12px;background:#7b3038;color:#fff;font-weight:900;font-size:12px}.def{background:#19416d}.move{background:#26352f}.parry{background:#5a461d}.message{text-align:center;min-height:23px;color:#bac5d3;font-size:13px;margin:6px 0}.exit{margin-top:7px;height:43px;border-radius:12px;border:1px solid #40536a;background:#172435;color:#fff;font-weight:800}
</style></head><body><div class="app"><div class="hud"><div><div class="name">PLAYER</div><div class="meter"><div class="hp"></div></div><div class="meter"><div class="st"></div></div></div><div><div class="clock">3:00</div><div class="round">ROUND 1</div></div><div><div class="name right">CPU</div><div class="meter"><div class="hp cpuHp"></div></div><div class="meter"><div class="st"></div></div></div></div>
<div class="stage"><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div class="floor"></div>
<div class="fighter player"><svg viewBox="0 0 440 640" preserveAspectRatio="xMidYMid meet" aria-label="player"><g class="body"><path class="leg" d="M205 470 L180 560"/><path class="leg" d="M260 470 L280 560"/><path class="shoe" d="M145 552 Q177 538 205 554 L201 578 L143 578Z"/><path class="shoe" d="M253 552 Q282 540 307 556 L307 578 L249 578Z"/><path class="shorts" d="M145 432 Q220 454 295 432 L295 490 Q220 510 145 490Z"/><path class="shirt" d="M157 265 Q220 238 283 265 L300 450 Q220 480 140 450Z"/><path class="skin" d="M203 237 L203 264 Q220 275 237 263 L237 237Z"/><ellipse class="skin2" cx="220" cy="180" rx="58" ry="68"/><path class="hair" d="M164 170 Q160 103 220 102 Q280 103 276 170 Q248 153 220 154 Q190 153 164 170Z"/><ellipse class="eye" cx="199" cy="184" rx="5" ry="7"/><ellipse class="eye" cx="241" cy="184" rx="5" ry="7"/><path class="mouth" d="M210 216 Q220 221 230 216"/>
<path id="pLeadUpper" class="upper" d="M170 285 L135 335"/><path id="pLeadFore" class="fore" d="M135 335 L175 245"/><circle id="pLeadJoint" class="joint" cx="135" cy="335" r="11"/><g id="pLeadGlove" transform="translate(175 245)"><path class="glove" d="M-19 -17 Q-7 -35 13 -28 Q30 -21 27 -3 L18 13 Q3 22 -14 13 L-25 0Z"/></g>
<path id="pRearUpper" class="upper" d="M265 285 L305 335"/><path id="pRearFore" class="fore" d="M305 335 L270 245"/><circle id="pRearJoint" class="joint" cx="305" cy="335" r="11"/><g id="pRearGlove" transform="translate(270 245)"><path class="rearGlove" d="M-19 -17 Q-7 -35 13 -28 Q30 -21 27 -3 L18 13 Q3 22 -14 13 L-25 0Z"/></g></g></svg></div>
<div class="fighter cpu"><svg viewBox="0 0 440 640" preserveAspectRatio="xMidYMid meet" aria-label="cpu"><g><path class="leg" d="M205 470 L180 560"/><path class="leg" d="M260 470 L280 560"/><path class="shoe" d="M145 552 Q177 538 205 554 L201 578 L143 578Z"/><path class="shoe" d="M253 552 Q282 540 307 556 L307 578 L249 578Z"/><path class="shorts" d="M145 432 Q220 454 295 432 L295 490 Q220 510 145 490Z"/><path class="shirt cpuShirt" d="M157 265 Q220 238 283 265 L300 450 Q220 480 140 450Z"/><path class="skin" d="M203 237 L203 264 Q220 275 237 263 L237 237Z"/><ellipse class="skin2" cx="220" cy="180" rx="58" ry="68"/><path class="hair" d="M164 170 Q160 103 220 102 Q280 103 276 170 Q248 153 220 154 Q190 153 164 170Z"/><ellipse class="eye" cx="199" cy="184" rx="5" ry="7"/><ellipse class="eye" cx="241" cy="184" rx="5" ry="7"/><path class="mouth" d="M210 216 Q220 221 230 216"/><path class="upper" d="M170 285 L135 335"/><path class="fore" d="M135 335 L175 245"/><circle class="joint" cx="135" cy="335" r="11"/><g transform="translate(175 245)"><path class="glove" d="M-19 -17 Q-7 -35 13 -28 Q30 -21 27 -3 L18 13 Q3 22 -14 13 L-25 0Z"/></g><path class="upper" d="M265 285 L305 335"/><path class="fore" d="M305 335 L270 245"/><circle class="joint" cx="305" cy="335" r="11"/><g transform="translate(270 245)"><path class="rearGlove" d="M-19 -17 Q-7 -35 13 -28 Q30 -21 27 -3 L18 13 Q3 22 -14 13 L-25 0Z"/></g></g></svg></div></div>
<div class="message" id="msg">GUARD — 앞손은 눈/코 앞, 뒷손은 턱 아래</div><div class="controls"><button class="btn" data-a="jab">👊 JAB<br>왼손</button><button class="btn" data-a="straight">👊 STRAIGHT<br>오른손</button><button class="btn" data-a="hook">🥊 HOOK</button><button class="btn" data-a="upper">🥊 UPPER</button><button class="btn def" data-a="guard">🛡 GUARD</button><button class="btn def" data-a="slip">↙ SLIP</button><button class="btn def" data-a="duck">↓ DUCK</button><button class="btn parry" data-a="parry">⚡ PARRY</button><button class="btn move" data-a="walkL">← STEP</button><button class="btn move" data-a="walkR">STEP →</button><button class="btn move" data-a="dashL">≪ DASH</button><button class="btn move" data-a="dashR">DASH ≫</button></div><button class="exit" onclick="location.reload()">경기 나가기</button></div>
<script>
const base={lead:{s:[170,285],e:[135,335],w:[175,245]},rear:{s:[265,285],e:[305,335],w:[270,245]},dx:0,dy:0,rot:0};
const msg={guard:'GUARD — 팔꿈치는 안쪽/아래, 앞손은 눈/코 앞',jab:'JAB — 왼손이 어깨에서 직선 신전',straight:'STRAIGHT — 오른손 신전 + 상체 회전',hook:'HOOK — 팔꿈치를 굽힌 채 수평 회전',upper:'UPPER — 팔꿈치를 굽힌 채 아래에서 위로',slip:'SLIP — 머리와 상체를 옆으로 이동',duck:'DUCK — 무릎/골반을 낮춤',parry:'PARRY — 앞손을 짧게 바깥으로'};
function clone(o){return JSON.parse(JSON.stringify(o))}function pose(a){const p=clone(base);if(a==='jab'){p.lead.e=[178,286];p.lead.w=[347,286];p.rot=-1}if(a==='straight'){p.rear.e=[292,286];p.rear.w=[350,275];p.rot=-4;p.dx=-4}if(a==='hook'){p.lead.e=[205,300];p.lead.w=[286,273];p.rot=-5}if(a==='upper'){p.lead.e=[155,330];p.lead.w=[202,205];p.rot=-3;p.dy=5}if(a==='slip'){p.dx=-18;p.dy=4;p.rot=-5}if(a==='duck'){p.dy=30;p.rot=2}if(a==='parry'){p.lead.e=[158,305];p.lead.w=[240,252];p.rot=2}if(a==='walkL')p.dx=-25;if(a==='walkR')p.dx=25;if(a==='dashL'){p.dx=-50;p.rot=-3}if(a==='dashR'){p.dx=50;p.rot=3}return p}
function seg(el,a,b){el.setAttribute('d',`M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`)}function apply(f,p){seg(f.querySelector('#pLeadUpper'),p.lead.s,p.lead.e);seg(f.querySelector('#pLeadFore'),p.lead.e,p.lead.w);seg(f.querySelector('#pRearUpper'),p.rear.s,p.rear.e);seg(f.querySelector('#pRearFore'),p.rear.e,p.rear.w);f.querySelector('#pLeadJoint').setAttribute('cx',p.lead.e[0]);f.querySelector('#pLeadJoint').setAttribute('cy',p.lead.e[1]);f.querySelector('#pRearJoint').setAttribute('cx',p.rear.e[0]);f.querySelector('#pRearJoint').setAttribute('cy',p.rear.e[1]);f.querySelector('#pLeadGlove').setAttribute('transform',`translate(${p.lead.w[0]} ${p.lead.w[1]})`);f.querySelector('#pRearGlove').setAttribute('transform',`translate(${p.rear.w[0]} ${p.rear.w[1]})`);f.parentElement.style.transform=`translate(${p.dx}px,${p.dy}px) rotate(${p.rot}deg)`}
const player=document.querySelector('.player svg');apply(player,base);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;apply(player,pose(a));document.getElementById('msg').textContent=msg[a]||a});
</script></body></html>
