<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BOXING GAME 2.3</title>
<style>
:root{--bg:#070a0f;--panel:#121923;--line:#303b49;--text:#f5f7fa;--muted:#98a5b4;--red:#ff4d52;--blue:#3d8bfd;--green:#39cf82;--gold:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;touch-action:manipulation}
#app{height:100%;display:flex;justify-content:center;background:radial-gradient(circle at 50% 8%,#1b2532,#080b10 58%)}
.screen{width:min(100%,780px);height:100%;padding:calc(env(safe-area-inset-top)+12px) 12px calc(env(safe-area-inset-bottom)+10px);display:flex;flex-direction:column;gap:10px}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:2px}.badge{font-size:11px;color:#b8c2cd;border:1px solid #3a4654;border-radius:99px;padding:6px 9px}
.btn{min-height:52px;border-radius:14px;background:#202a36;border:1px solid #3a4654;font-weight:850}.primary{background:var(--red)!important;border-color:#ff7074!important}.secondary{background:#182435}.home{justify-content:center}.logo{text-align:center;font-size:48px;font-weight:1000;letter-spacing:4px}.subtitle,.small,.hint{color:var(--muted);text-align:center}.menu{display:grid;gap:10px;margin-top:18px}.small{font-size:12px;line-height:1.55}
.panel{background:#121923f5;border:1px solid var(--line);border-radius:17px}.section{padding:14px}.section h2{font-size:17px;margin:0 0 10px}.choices{display:flex;gap:8px;overflow:auto}.choice{min-width:76px;height:48px;border-radius:11px;background:#1b2430;border:1px solid #3b4654;font-size:12px}.choice.active{outline:2px solid var(--red)}.stat{margin:10px 0}.statline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.range{width:100%;accent-color:var(--red)}
.preview{height:170px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;position:relative;background:linear-gradient(#141d29,#0d1219)}.fighter{position:relative;width:110px;height:156px}.fighter .head,.boxer .head{position:absolute;border-radius:50%;background:#b87552}.fighter .head{left:31px;top:2px;width:48px;height:48px}.fighter .hair,.boxer .hair{position:absolute;background:#241b19;border-radius:28px 28px 10px 10px;z-index:5}.fighter .hair{left:28px;top:0;width:54px;height:24px}.fighter .body,.boxer .body{background:#2e75cf}.fighter .body{position:absolute;left:20px;top:47px;width:70px;height:73px;border-radius:28px}.fighter .neck,.boxer .neck{position:absolute;background:#b87552}.fighter .neck{left:48px;top:43px;width:15px;height:13px}.fighter .arm{position:absolute;top:57px;width:21px;height:62px;border-radius:15px;background:#b87552}.fighter .arm.l{left:4px;transform:rotate(15deg)}.fighter .arm.r{right:4px;transform:rotate(-15deg)}.fighter .glove{position:absolute;width:23px;height:23px;border-radius:50%;background:var(--red);bottom:-8px}.fighter .shorts,.boxer .shorts{background:#242a33}.fighter .shorts{position:absolute;left:19px;top:113px;width:72px;height:39px}.fighter .leg{position:absolute;top:141px;width:23px;height:44px;border-radius:14px;background:#b87552}.fighter .leg.l{left:27px}.fighter .leg.r{right:27px}
.hud{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:end}.name{font-size:11px;color:var(--muted);margin-bottom:4px}.right{text-align:right}.bar{height:14px;background:#28313c;border-radius:99px;overflow:hidden}.fill{height:100%}.hpP{background:var(--green)}.hpE{background:var(--red)}.stamina{height:5px;margin-top:4px;background:#26303a;border-radius:99px;overflow:hidden}.stamina>div{height:100%;background:var(--gold)}.timer{text-align:center;font-size:23px;font-weight:950}.round{text-align:center;color:var(--muted);font-size:10px}
.ring{position:relative;flex:1;min-height:300px;border-radius:17px;overflow:hidden;border:1px solid #3b4654;background:linear-gradient(#202b3a 0 47%,#151d27 47%)}.lights{position:absolute;inset:0 0 53%;background:radial-gradient(ellipse at 50% 25%,#ffffff22,#ffffff00 55%)}.crowd{position:absolute;inset:15% 0 55%;opacity:.25;background:radial-gradient(circle at 10% 55%,#fff 0 2px,transparent 3px),radial-gradient(circle at 30% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 50% 60%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 90% 60%,#fff 0 2px,transparent 3px)}.floor{position:absolute;left:0;right:0;bottom:0;height:53%;background:linear-gradient(#1b2530,#10161e);transform:perspective(500px) rotateX(8deg);transform-origin:bottom}.floor:after{content:"";position:absolute;inset:15% 8% 7%;border:2px solid #aeb6be55}.ropes{position:absolute;left:0;right:0;top:47%;height:35px;border-top:3px solid #e1e5e9;border-bottom:3px solid #858e98;z-index:3}.corner{position:absolute;top:42%;width:10px;height:105px;background:#9ba3ab;z-index:4}.corner.l{left:8%}.corner.r{right:8%}
.boxer{position:absolute;bottom:14%;width:100px;height:190px;z-index:8;transition:.16s}.boxer.player{left:14%}.boxer.enemy{left:68%;transform:scaleX(-1)}.boxer .head{left:29px;top:0;width:45px;height:45px;z-index:4}.boxer .hair{left:26px;top:-1px;width:51px;height:22px}.boxer .neck{left:45px;top:39px;width:14px;height:15px;z-index:2}.boxer .body{position:absolute;left:18px;top:45px;width:67px;height:73px;border-radius:25px;z-index:2}.boxer.enemy .body{background:#b72f39}.boxer .arm{position:absolute;top:54px;width:20px;height:64px;border-radius:14px;background:#b87552;z-index:3;transform-origin:top center}.boxer .arm.l{left:3px;transform:rotate(13deg)}.boxer .arm.r{right:3px;transform:rotate(-13deg)}.boxer .glove{position:absolute;width:25px;height:25px;border-radius:50%;background:var(--red);bottom:-9px;left:-3px;box-shadow:0 2px 6px #0008}.boxer.enemy .glove{background:var(--blue)}.boxer .shorts{position:absolute;left:18px;top:110px;width:68px;height:42px;border-radius:7px}.boxer .leg{position:absolute;top:146px;width:23px;height:50px;border-radius:14px;background:#b87552}.boxer .leg.l{left:27px}.boxer .leg.r{right:27px}.boxer .shoe{position:absolute;top:186px;width:30px;height:10px;border-radius:8px;background:#111820}.boxer .shoe.l{left:20px}.boxer .shoe.r{right:20px}.boxer.guard .arm.l{transform:rotate(65deg)}.boxer.guard .arm.r{transform:rotate(-65deg)}.boxer.weave{bottom:19%}.boxer.duck{bottom:10%;transform:scaleY(.8)}.boxer.enemy.duck{transform:scaleY(.8) scaleX(-1)}
.boxer.attack-jab .arm.r{animation:jab .28s}.boxer.attack-straight .arm.r{animation:straight .34s}.boxer.attack-hook .arm.r{animation:hook .38s}.boxer.attack-upper .arm.r{animation:upper .4s}.boxer.attack-jab,.boxer.attack-straight,.boxer.attack-hook,.boxer.attack-upper{animation:body .28s}.boxer.enemy.attack-jab,.boxer.enemy.attack-straight,.boxer.enemy.attack-hook,.boxer.enemy.attack-upper{animation:bodyE .28s}.boxer.hurt{animation:hurt .34s}.boxer.critical{filter:brightness(1.35)}
@keyframes jab{0%{transform:rotate(-13deg)}45%{transform:translate(48px,2px) rotate(-1deg)}100%{transform:rotate(-13deg)}}@keyframes straight{0%{transform:rotate(-13deg)}35%{transform:translate(62px) rotate(0)}70%{transform:translate(62px) rotate(0)}100%{transform:rotate(-13deg)}}@keyframes hook{0%{transform:rotate(-13deg)}35%{transform:translate(27px,12px) rotate(-105deg)}65%{transform:translate(42px,-2px) rotate(-55deg)}100%{transform:rotate(-13deg)}}@keyframes upper{0%{transform:rotate(-13deg)}35%{transform:translate(30px,-6px) rotate(-72deg)}65%{transform:translate(43px,-31px) rotate(-34deg)}100%{transform:rotate(-13deg)}}@keyframes body{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(10px) rotate(2deg)}}@keyframes bodyE{0%,100%{transform:translateX(0) scaleX(-1)}35%{transform:translateX(-10px) scaleX(-1) rotate(-2deg)}}@keyframes hurt{0%,100%{transform:translateX(0)}22%{transform:translateX(18px) rotate(5deg)}50%{transform:translateX(-9px) rotate(-3deg)}}
.status{text-align:center;height:22px;color:#aeb8c4;font-size:12px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.controls button{min-height:44px;border-radius:11px;border:1px solid #3a4654;font-size:11px;font-weight:900}.atk{background:#642c33}.def{background:#203e61}.move{background:#28322f}.special{background:#4c3b21}.hint{font-size:10px}.combo{position:absolute;top:10%;left:50%;font-size:20px;font-weight:1000;opacity:0;z-index:20}.combo.show{animation:combo .65s}.damage{position:absolute;z-index:21;font-weight:1000;font-size:20px;animation:damage .7s forwards;text-shadow:0 2px 6px #000}@keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.7)}25%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%)}}@keyframes damage{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}.result{position:absolute;inset:0;z-index:30;background:#05080dcc;display:flex;align-items:center;justify-content:center}.resultBox{width:86%;padding:28px 20px;border-radius:20px;text-align:center;background:#121923;border:1px solid #3c4856}.resultBox h1{font-size:38px;margin:0 0 8px}.resultBox p{color:var(--muted);line-height:1.5}.flash{position:absolute;inset:0;background:white;opacity:0;z-index:25}.flash.on{animation:flash .15s}@keyframes flash{from{opacity:.5}to{opacity:0}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const s={skin:'#b87552',hair:'#241b19',height:1,weight:70,power:60,speed:60,step:60,tough:60,php:100,ehp:100,pst:100,est:100,time:180,running:false,guard:false,dodge:0,px:14,ex:68,last:0,combo:0,lastHit:0};
const A={jab:{d:7,c:7,r:22,cd:280},straight:{d:10,c:9,r:24,cd:390},hook:{d:12,c:12,r:21,cd:470},upper:{d:15,c:15,r:19,cd:560}};
function home(){app.innerHTML=`<main class="screen home"><div class="top"><b class="brand">BOXING GAME</b><span class="badge">PROTOTYPE 2.3</span></div><div><div class="logo">🥊 BOXING</div><div class="subtitle">Mobile Boxing Prototype</div></div><div class="menu"><button class="btn primary" onclick="fight()">경기 시작</button><button class="btn secondary" onclick="custom()">내 복서 만들기</button></div><div class="small">아이폰 터치 조작 · 오프라인 싱글 플레이<br>2.3 · 강화된 복서 · 실제 펀치 궤적 · 몸통 반동 · 콤보 · 크리티컬 · KO</div></main>`}
function custom(){app.innerHTML=`<main class="screen"><div class="top"><b>MY BOXER</b><button class="btn" style="min-height:38px;padding:0 13px" onclick="home()">뒤로</button></div><div class="preview panel"><div class="fighter" style="transform:scaleY(${s.height})"><div class="hair" style="background:${s.hair}"></div><div class="head" style="background:${s.skin}"></div><div class="neck" style="background:${s.skin}"></div><div class="body"></div><div class="arm l" style="background:${s.skin}"><div class="glove"></div></div><div class="arm r" style="background:${s.skin}"><div class="glove"></div></div><div class="shorts"></div><div class="leg l" style="background:${s.skin}"></div><div class="leg r" style="background:${s.skin}"></div></div></div><section class="panel section"><h2>피부색</h2><div class="choices">${['#7a4934','#9a5e43','#b87552','#d29570','#edb895'].map((c,i)=>`<button class="choice ${s.skin==c?'active':''}" style="background:${c}" onclick="s.skin='${c}';custom()">${['진한색','갈색','중간','밝은색','아주 밝은색'][i]}</button>`).join('')}</div><h2 style="margin-top:16px">헤어</h2><div class="choices">${['#171717','#3b2418','#7b4b2a','#d2a03c','#d8d8d8'].map((c,i)=>`<button class="choice ${s.hair==c?'active':''}" style="background:${c}" onclick="s.hair='${c}';custom()">${['숏컷','갈색','브라운','블론드','실버'][i]}</button>`).join('')}</div>${[['height','키',.85,1.15,.01],['weight','체급',50,100,1],['power','주먹 파워',0,100,1],['speed','주먹 속도',0,100,1],['step','스텝 속도',0,100,1],['tough','맷집',0,100,1]].map(x=>`<div class="stat"><div class="statline"><span>${x[1]}</span><b>${x[0]=='height'?Math.round(160+s.height*25)+' cm':s[x[0]]}</b></div><input class="range" type="range" min="${x[2]}" max="${x[3]}" step="${x[4]}" value="${s[x[0]]}" oninput="s['${x[0]}']=+this.value;custom()"></div>`).join('')}</section><button class="btn primary" onclick="fight()">이 복서로 경기하기</button></main>`}
function fighter(id,e=false){return `<div id="${id}" class="boxer ${e?'enemy':'player'}"><div class="hair" ${e?'':'style="background:'+s.hair+'"'}></div><div class="head" ${e?'':'style="background:'+s.skin+'"'}></div><div class="neck" ${e?'':'style="background:'+s.skin+'"'}></div><div class="body"></div><div class="arm l" ${e?'':'style="background:'+s.skin+'"'}><div class="glove"></div></div><div class="arm r" ${e?'':'style="background:'+s.skin+'"'}><div class="glove"></div></div><div class="shorts"></div><div class="leg l" ${e?'':'style="background:'+s.skin+'"'}></div><div class="leg r" ${e?'':'style="background:'+s.skin+'"'}></div><div class="shoe l"></div><div class="shoe r"></div></div>`}
function fight(){Object.assign(s,{php:100,ehp:100,pst:100,est:100,time:180,running:true,guard:false,dodge:0,px:14,ex:68,last:0,combo:0,lastHit:0});app.innerHTML=`<main class="screen fight"><div class="hud"><div><div class="name">PLAYER</div><div class="bar"><div id="php" class="fill hpP"></div></div><div class="stamina"><div id="pst"></div></div></div><div><div id="timer" class="timer">3:00</div><div class="round">ROUND 1</div></div><div><div class="name right">CPU</div><div class="bar"><div id="ehp" class="fill hpE"></div></div><div class="stamina"><div id="est"></div></div></div></div><div id="ring" class="ring"><div class="lights"></div><div class="crowd"></div><div class="floor"></div><div class="ropes"></div><div class="corner l"></div><div class="corner r"></div>${fighter('player')}${fighter('enemy',true)}<div id="combo" class="combo"></div><div id="flash" class="flash"></div><div id="result" class="result hidden"><div class="resultBox"><h1 id="rt"></h1><p id="rx"></p><button class="btn primary" onclick="home()">메인으로</button></div></div></div><div id="status" class="status">거리를 좁혀 공격하세요</div><div class="controls"><button class="atk" onclick="atk('jab')">👊 JAB</button><button class="atk" onclick="atk('straight')">👊 STRAIGHT</button><button class="atk" onclick="atk('hook')">🥊 HOOK</button><button class="atk" onclick="atk('upper')">🥊 UPPER</button><button class="def" onclick="guard()">🛡️ GUARD</button><button class="def" onclick="dodge('weave')">↙ WEAVE</button><button class="def" onclick="dodge('duck')">↓ DUCK</button><button class="special" onclick="parry()">⚡ PARRY</button><button class="move" onclick="move(-1,0)">← WALK</button><button class="move" onclick="move(1,0)">WALK →</button><button class="move" onclick="move(-1,1)">↞ DASH</button><button class="move" onclick="move(1,1)">DASH ↠</button></div><div class="hint">공격은 거리 안에서 적중 · 연속 적중 시 콤보 · 스태미나가 낮으면 데미지 감소</div><button class="btn" style="min-height:38px" onclick="quit()">경기 나가기</button></main>`;last=performance.now();acc=cpuAcc=regen=0;requestAnimationFrame(loop)}
function stat(t){let x=$('status');if(x)x.textContent=t}function d(){return Math.abs(s.ex-s.px)}function upd(){if(!$('php'))return;$('php').style.width=s.php+'%';$('ehp').style.width=s.ehp+'%';$('pst').style.width=s.pst+'%';$('est').style.width=s.est+'%';$('timer').textContent=Math.floor(s.time/60)+':'+String(Math.max(0,s.time)%60).padStart(2,'0');$('player').style.left=s.px+'%';$('enemy').style.left=s.ex+'%'}
function anim(w,t){let p=$(w);p.classList.remove('attack-jab','attack-straight','attack-hook','attack-upper');void p.offsetWidth;p.classList.add('attack-'+t);setTimeout(()=>p.classList.remove('attack-'+t),450)}
function dmg(target,n,crit=false){let e=document.createElement('div');e.className='damage';e.textContent=(crit?'CRIT ':'')+'-'+n;e.style.left=(target=='e'?s.ex:s.px)+'%';e.style.top='42%';$('ring').appendChild(e);setTimeout(()=>e.remove(),720)}
function atk(t){if(!s.running)return;let a=A[t],now=performance.now(),cd=Math.max(160,a.cd*(1.15-s.speed/150));if(now-s.last<cd)return stat('아직 공격이 준비되지 않았습니다');if(s.pst<a.c)return stat('스태미나 부족!');s.last=now;s.pst-=a.c;anim('player',t);if(d()>a.r){s.combo=0;return stat(t.toUpperCase()+'! 빗나갔습니다 — 거리가 멉니다')}if(Math.random()<.08+s.est/1100){s.combo=0;return stat('상대가 회피했습니다!')}let n=Math.round(a.d*(.62+s.power/105)*(.78+s.weight/120)*(.55+s.pst/180)),crit=Math.random()<.07+s.power/1600;if(crit)n=Math.round(n*1.65);s.ehp=Math.max(0,s.ehp-n);s.combo=now-s.lastHit<900?s.combo+1:1;s.lastHit=now;let e=$('enemy');e.classList.add('hurt');if(crit)e.classList.add('critical');setTimeout(()=>e.classList.remove('hurt','critical'),360);dmg('e',n,crit);if(s.combo>1){let c=$('combo');c.textContent=s.combo+' HIT COMBO';c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}flash();stat((crit?'🔥 CRITICAL! ':'')+t.toUpperCase()+' 적중! -'+n);if(s.ehp<=0)end(true,'KO! 상대를 쓰러뜨렸습니다.')}
function guard(){if(!s.running)return;s.guard=!s.guard;$('player').classList.toggle('guard',s.guard);stat(s.guard?'🛡️ 가드 중 — 다시 누르면 해제':'가드 해제');if(s.guard)setTimeout(()=>{s.guard=false;$('player').classList.remove('guard')},1100)}
function dodge(t){if(!s.running)return;s.dodge=performance.now()+520;let p=$('player');p.classList.remove('weave','duck');void p.offsetWidth;p.classList.add(t);stat(t=='weave'?'↙ 위빙!':'↓ 더킹!');setTimeout(()=>p.classList.remove(t),520)}
function parry(){if(!s.running)return;s.dodge=performance.now()+300;s.guard=true;$('player').classList.add('guard');stat('⚡ 패링 준비!');setTimeout(()=>{s.guard=false;$('player').classList.remove('guard')},320)}
function move(dir,dash){if(!s.running)return;s.px=Math.max(7,Math.min(77,s.px+dir*(dash?8:3.5)*(.72+s.step/100)));stat(dash?'↠ 대시 스텝!':'스텝!');upd()}
function cpu(){if(!s.running)return;let x=d();if(x>24){s.ex+=(s.px>s.ex?1:-1)*2.4;return}if(Math.random()<.2){s.ex+=(Math.random()>.5?1:-1)*3;return}let t=['jab','straight','hook','upper'][Math.floor(Math.random()*4)],a=A[t];s.est=Math.max(0,s.est-a.c);anim('enemy',t);if(performance.now()<s.dodge)return stat('✨ 상대 공격 회피!');if(s.guard){if(Math.random()<.7){let n=Math.round(4+s.power*.07);s.ehp=Math.max(0,s.ehp-n);dmg('e',n);stat('⚡ 패링 성공! 반격 -'+n)}else{let n=Math.max(1,Math.round(a.d*.5*(1-s.tough/180)));s.php=Math.max(0,s.php-n);dmg('p',n);stat('가드했지만 충격! -'+n)}return}let n=Math.round(a.d*(.75+Math.random()*.35)*(1.05-s.tough/220));s.php=Math.max(0,s.php-n);$('player').classList.add('hurt');setTimeout(()=>$('player').classList.remove('hurt'),360);dmg('p',n);stat('상대 '+t.toUpperCase()+'! -'+n);flash();if(s.php<=0)end(false,'KO! 체력이 모두 소진되었습니다.')}
function flash(){let f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function end(win,msg){if(!s.running)return;s.running=false;$('result').classList.remove('hidden');$('rt').textContent=win?'VICTORY':'DEFEAT';$('rx').textContent=msg;upd()}function quit(){s.running=false;home()}
let last=0,acc=0,cpuAcc=0,regen=0;
function loop(ts){if(!s.running)return;let dt=(ts-last)/1000;last=ts;acc+=dt;cpuAcc+=dt;regen+=dt;if(acc>=1){s.time--;acc=0;if(s.time<=0)return end(s.php>s.ehp,'3라운드 종료 — 판정으로 경기가 끝났습니다.')}if(regen>=.25){regen=0;s.pst=Math.min(100,s.pst+1.8);s.est=Math.min(100,s.est+1.5)}if(cpuAcc>1+Math.random()*.6){cpuAcc=0;cpu()}upd();requestAnimationFrame(loop)}
home();
</script></body></html>
