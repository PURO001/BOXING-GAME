<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BOXING GAME 2.4</title>
<style>
:root{--bg:#070a0f;--panel:#121923;--line:#354150;--text:#f5f7fa;--muted:#9ca8b6;--red:#ef4444;--blue:#3b82f6;--gold:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;touch-action:manipulation}
#app{height:100%;display:flex;justify-content:center}
.screen{width:min(100%,780px);height:100%;padding:calc(env(safe-area-inset-top)+10px) 11px calc(env(safe-area-inset-bottom)+9px);display:flex;flex-direction:column;gap:8px}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:2px}.badge{font-size:10px;color:#b9c4d0;border:1px solid #3c4755;border-radius:99px;padding:5px 8px}
.btn{min-height:48px;border-radius:13px;background:#202a36;border:1px solid #3b4654;font-weight:850}.primary{background:var(--red)!important}.secondary{background:#192536}
.home{justify-content:center}.logo{text-align:center;font-size:46px;font-weight:1000;letter-spacing:3px}.subtitle,.small,.hint{color:var(--muted);text-align:center}.menu{display:grid;gap:9px;margin-top:16px}.small{font-size:11px;line-height:1.55}
.hud{display:grid;grid-template-columns:1fr 70px 1fr;gap:7px;align-items:end}.name{font-size:10px;color:var(--muted);margin-bottom:3px}.right{text-align:right}.bar{height:13px;background:#29323d;border-radius:99px;overflow:hidden}.fill{height:100%}.hpP{background:#39cf82}.hpE{background:#ff4d52}.stamina{height:5px;margin-top:4px;background:#26303a;border-radius:99px;overflow:hidden}.stamina>div{height:100%;background:var(--gold)}.timer{text-align:center;font-size:21px;font-weight:950}.round{text-align:center;color:var(--muted);font-size:9px}
.ring{position:relative;flex:1;min-height:300px;border-radius:16px;overflow:hidden;border:1px solid #3a4653;background:linear-gradient(#202b3a 0 46%,#141b24 46%)}.lights{position:absolute;inset:0 0 55%;background:radial-gradient(ellipse at 50% 25%,#fff2,#fff0 55%)}.crowd{position:absolute;inset:14% 0 55%;opacity:.22;background:radial-gradient(circle at 10% 55%,#fff 0 2px,transparent 3px),radial-gradient(circle at 30% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 50% 60%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 90% 60%,#fff 0 2px,transparent 3px)}.floor{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(#1c2630,#10161e);transform:perspective(500px) rotateX(8deg);transform-origin:bottom}.floor:after{content:"";position:absolute;inset:15% 8% 7%;border:2px solid #b5bdc655}.ropes{position:absolute;left:0;right:0;top:46%;height:36px;border-top:3px solid #e3e7eb;border-bottom:3px solid #858e98;z-index:4}.corner{position:absolute;top:41%;width:10px;height:105px;background:#9ba3ab;z-index:5}.corner.l{left:8%}.corner.r{right:8%}
.boxer{position:absolute;bottom:13%;width:116px;height:205px;z-index:8;transform-origin:center bottom;transition:left .15s ease,bottom .12s ease}.boxer.player{left:13%}.boxer.enemy{left:69%;transform:scaleX(-1)}
.head{position:absolute;left:36px;top:0;width:48px;height:48px;border-radius:50%;background:#b87552;z-index:5}.hair{position:absolute;left:33px;top:-1px;width:54px;height:23px;background:#241b19;border-radius:28px 28px 8px 8px;z-index:7}.neck{position:absolute;left:52px;top:42px;width:16px;height:18px;background:#b87552;z-index:2}.torso{position:absolute;left:25px;top:51px;width:68px;height:72px;border-radius:27px 27px 20px 20px;background:#2f77d0;z-index:2}.enemy .torso{background:#b82f3b}.shoulder{position:absolute;top:53px;width:26px;height:24px;border-radius:50%;background:#2f77d0;z-index:3}.enemy .shoulder{background:#b82f3b}.shoulder.l{left:15px}.shoulder.r{right:15px}.arm{position:absolute;top:59px;width:22px;height:67px;border-radius:14px;background:#b87552;z-index:4;transform-origin:50% 8px}.arm.l{left:13px;transform:rotate(16deg)}.arm.r{right:13px;transform:rotate(-16deg)}.glove{position:absolute;left:-3px;bottom:-11px;width:29px;height:27px;border-radius:48%;background:var(--red);box-shadow:0 3px 7px #0009}.enemy .glove{background:var(--blue)}.glove:after{content:"";position:absolute;left:4px;right:4px;top:5px;height:5px;border-radius:5px;background:#fff4}.shorts{position:absolute;left:25px;top:117px;width:68px;height:40px;border-radius:6px;background:#252c35;z-index:3}.leg{position:absolute;top:149px;width:24px;height:54px;border-radius:15px;background:#b87552;z-index:1}.leg.l{left:32px}.leg.r{right:32px}.shoe{position:absolute;top:194px;width:34px;height:11px;border-radius:8px;background:#0c1117;z-index:2}.shoe.l{left:24px}.shoe.r{right:24px}
.guard .arm.l{transform:rotate(65deg)}.guard .arm.r{transform:rotate(-65deg)}
/* linked boxing mechanics: legs -> hips -> torso -> shoulder -> elbow -> glove */
.attack .bodyGroup{animation:drive .42s ease-out}.jab .arm.r{animation:jab .42s ease-out}.straight .arm.r{animation:straight .52s ease-out}.hook .arm.r{animation:hook .5s ease-out}.upper .arm.r{animation:upper .52s ease-out}
.enemy.attack .bodyGroup{animation:driveE .42s ease-out}.enemy.jab .arm.r{animation:jabE .42s ease-out}.enemy.straight .arm.r{animation:straightE .52s ease-out}.enemy.hook .arm.r{animation:hookE .5s ease-out}.enemy.upper .arm.r{animation:upperE .52s ease-out}
@keyframes drive{0%,100%{transform:translateX(0) rotate(0)}28%{transform:translateX(6px) rotate(3deg)}55%{transform:translateX(9px) rotate(5deg)}}@keyframes driveE{0%,100%{transform:translateX(0) rotate(0)}28%{transform:translateX(-6px) rotate(-3deg)}55%{transform:translateX(-9px) rotate(-5deg)}}
@keyframes jab{0%{transform:rotate(-16deg)}25%{transform:rotate(-8deg)}48%{transform:translate(48px,-2px) rotate(0)}68%{transform:translate(48px,-2px) rotate(0)}100%{transform:rotate(-16deg)}}@keyframes straight{0%{transform:rotate(-16deg)}24%{transform:rotate(-5deg)}48%{transform:translate(65px,-3px) rotate(0)}68%{transform:translate(65px,-3px) rotate(0)}100%{transform:rotate(-16deg)}}@keyframes hook{0%{transform:rotate(-16deg)}28%{transform:rotate(-42deg)}50%{transform:translate(33px,7px) rotate(-105deg)}68%{transform:translate(45px,1px) rotate(-65deg)}100%{transform:rotate(-16deg)}}@keyframes upper{0%{transform:rotate(-16deg)}25%{transform:translate(5px,13px) rotate(-45deg)}50%{transform:translate(39px,-25px) rotate(-30deg)}68%{transform:translate(45px,-32px) rotate(-22deg)}100%{transform:rotate(-16deg)}}
@keyframes jabE{0%{transform:rotate(-16deg)}48%{transform:translate(-48px,-2px) rotate(0)}68%{transform:translate(-48px,-2px) rotate(0)}100%{transform:rotate(-16deg)}}@keyframes straightE{0%{transform:rotate(-16deg)}48%{transform:translate(-65px,-3px) rotate(0)}68%{transform:translate(-65px,-3px) rotate(0)}100%{transform:rotate(-16deg)}}@keyframes hookE{0%{transform:rotate(-16deg)}50%{transform:translate(-33px,7px) rotate(-105deg)}68%{transform:translate(-45px,1px) rotate(-65deg)}100%{transform:rotate(-16deg)}}@keyframes upperE{0%{transform:rotate(-16deg)}50%{transform:translate(-39px,-25px) rotate(-30deg)}68%{transform:translate(-45px,-32px) rotate(-22deg)}100%{transform:rotate(-16deg)}}
.weave{bottom:18%!important;transform:rotate(-5deg)}.enemy.weave{transform:scaleX(-1) rotate(5deg)}.duck{bottom:8%!important;transform:scaleY(.78)}.enemy.duck{transform:scaleX(-1) scaleY(.78)}.hurt{animation:hit .36s}.counter{animation:counter .3s}.critical{filter:brightness(1.35)}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(17px) rotate(5deg)}55%{transform:translateX(-7px) rotate(-3deg)}}@keyframes counter{0%,100%{transform:translateX(0)}35%{transform:translateX(-7px)}}
.status{text-align:center;height:21px;color:#b1bac5;font-size:11px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.controls button{min-height:42px;border-radius:10px;border:1px solid #3a4654;font-size:10px;font-weight:900}.atk{background:#612b32}.def{background:#203d5f}.move{background:#28332f}.special{background:#4b3a20}.hint{font-size:9px}.combo{position:absolute;top:9%;left:50%;font-size:20px;font-weight:1000;opacity:0;z-index:20}.combo.show{animation:combo .7s}.damage{position:absolute;z-index:21;font-weight:1000;font-size:19px;animation:damage .72s forwards;text-shadow:0 2px 6px #000}.result{position:absolute;inset:0;z-index:30;background:#05080dcc;display:flex;align-items:center;justify-content:center}.resultBox{width:86%;padding:27px 19px;border-radius:19px;text-align:center;background:#121923;border:1px solid #3d4957}.resultBox h1{font-size:36px;margin:0 0 7px}.resultBox p{color:var(--muted);line-height:1.5}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25}.flash.on{animation:flash .13s}@keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.7)}25%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%)}}@keyframes damage{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}@keyframes flash{from{opacity:.48}to{opacity:0}}
.customPanel{padding:14px;background:#121923;border:1px solid var(--line);border-radius:16px}.preview{height:145px;display:flex;justify-content:center;align-items:flex-end;background:linear-gradient(#16202c,#0d1218);border-radius:15px;overflow:hidden}.choices{display:flex;gap:7px;overflow:auto}.choice{min-width:67px;height:43px;border-radius:10px;background:#1b2430;border:1px solid #3b4654;font-size:10px}.choice.active{outline:2px solid var(--red)}.stat{margin:8px 0}.statline{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.range{width:100%;accent-color:var(--red)}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const s={skin:'#b87552',hair:'#241b19',height:1,weight:70,power:60,speed:60,step:60,tough:60,php:100,ehp:100,pst:100,est:100,time:180,running:false,guard:false,dodge:0,px:13,ex:69,last:0,combo:0,lastHit:0};
const A={jab:{d:7,c:7,r:22,cd:280},straight:{d:10,c:9,r:24,cd:390},hook:{d:12,c:12,r:21,cd:470},upper:{d:15,c:15,r:19,cd:560}};
function home(){app.innerHTML=`<main class="screen home"><div class="top"><b class="brand">BOXING GAME</b><span class="badge">VERSION 2.4</span></div><div><div class="logo">🥊 BOXING</div><div class="subtitle">Mobile Boxing Prototype</div></div><div class="menu"><button class="btn primary" onclick="fight()">경기 시작</button><button class="btn secondary" onclick="custom()">내 복서 만들기</button></div><div class="small">아이폰 터치 조작 · 오프라인 싱글 플레이<br>2.4 · 연결형 펀치 모션 · 체중 이동 · 몸통 회전 · 피격 반동</div></main>`}
function custom(){app.innerHTML=`<main class="screen"><div class="top"><b>MY BOXER</b><button class="btn" style="min-height:36px;padding:0 12px" onclick="home()">뒤로</button></div><div class="preview"><div class="boxer player" style="position:relative;left:auto;bottom:auto;transform:scale(.65)"><div class="hair" style="background:${s.hair}"></div><div class="head" style="background:${s.skin}"></div><div class="neck" style="background:${s.skin}"></div><div class="torso"></div><div class="shoulder l"></div><div class="shoulder r"></div><div class="arm l" style="background:${s.skin}"><div class="glove"></div></div><div class="arm r" style="background:${s.skin}"><div class="glove"></div></div><div class="shorts"></div><div class="leg l" style="background:${s.skin}"></div><div class="leg r" style="background:${s.skin}"></div><div class="shoe l"></div><div class="shoe r"></div></div></div><section class="customPanel"><h2 style="margin:0 0 8px;font-size:16px">피부색</h2><div class="choices">${['#7a4934','#9a5e43','#b87552','#d29570','#edb895'].map(c=>`<button class="choice ${s.skin==c?'active':''}" style="background:${c}" onclick="s.skin='${c}';custom()"> </button>`).join('')}</div><h2 style="margin:13px 0 8px;font-size:16px">헤어</h2><div class="choices">${['#171717','#3b2418','#7b4b2a','#d2a03c','#d8d8d8'].map(c=>`<button class="choice ${s.hair==c?'active':''}" style="background:${c}" onclick="s.hair='${c}';custom()"> </button>`).join('')}</div>${[['height','키',.85,1.15,.01],['weight','체급',50,100,1],['power','주먹 파워',0,100,1],['speed','주먹 속도',0,100,1],['step','스텝 속도',0,100,1],['tough','맷집',0,100,1]].map(x=>`<div class="stat"><div class="statline"><span>${x[1]}</span><b>${x[0]=='height'?Math.round(160+s.height*25)+' cm':s[x[0]]}</b></div><input class="range" type="range" min="${x[2]}" max="${x[3]}" step="${x[4]}" value="${s[x[0]]}" oninput="s['${x[0]}']=+this.value;custom()"></div>`).join('')}</section><button class="btn primary" onclick="fight()">이 복서로 경기하기</button></main>`}
function fighter(id,e=false){return `<div id="${id}" class="boxer ${e?'enemy':''}"><div class="bodyGroup"><div class="hair" ${e?'':'style="background:'+s.hair+'"'}></div><div class="head" ${e?'':'style="background:'+s.skin+'"'}></div><div class="neck" ${e?'':'style="background:'+s.skin+'"'}></div><div class="torso"></div><div class="shoulder l"></div><div class="shoulder r"></div><div class="arm l" ${e?'':'style="background:'+s.skin+'"'}><div class="glove"></div></div><div class="arm r" ${e?'':'style="background:'+s.skin+'"'}><div class="glove"></div></div><div class="shorts"></div><div class="leg l" ${e?'':'style="background:'+s.skin+'"'}></div><div class="leg r" ${e?'':'style="background:'+s.skin+'"'}></div><div class="shoe l"></div><div class="shoe r"></div></div></div>`}
function fight(){Object.assign(s,{php:100,ehp:100,pst:100,est:100,time:180,running:true,guard:false,dodge:0,px:13,ex:69,last:0,combo:0,lastHit:0});app.innerHTML=`<main class="screen"><div class="hud"><div><div class="name">PLAYER</div><div class="bar"><div id="php" class="fill hpP"></div></div><div class="stamina"><div id="pst"></div></div></div><div><div id="timer" class="timer">3:00</div><div class="round">ROUND 1</div></div><div><div class="name right">CPU</div><div class="bar"><div id="ehp" class="fill hpE"></div></div><div class="stamina"><div id="est"></div></div></div></div><div id="ring" class="ring"><div class="lights"></div><div class="crowd"></div><div class="floor"></div><div class="ropes"></div><div class="corner l"></div><div class="corner r"></div>${fighter('player')}${fighter('enemy',true)}<div id="combo" class="combo"></div><div id="flash" class="flash"></div><div id="result" class="result hidden"><div class="resultBox"><h1 id="rt"></h1><p id="rx"></p><button class="btn primary" onclick="home()">메인으로</button></div></div></div><div id="status" class="status">거리를 좁혀 공격하세요</div><div class="controls"><button class="atk" onclick="atk('jab')">👊 JAB</button><button class="atk" onclick="atk('straight')">👊 STRAIGHT</button><button class="atk" onclick="atk('hook')">🥊 HOOK</button><button class="atk" onclick="atk('upper')">🥊 UPPER</button><button class="def" onclick="guard()">🛡️ GUARD</button><button class="def" onclick="dodge('weave')">↙ WEAVE</button><button class="def" onclick="dodge('duck')">↓ DUCK</button><button class="special" onclick="parry()">⚡ PARRY</button><button class="move" onclick="move(-1,0)">← WALK</button><button class="move" onclick="move(1,0)">WALK →</button><button class="move" onclick="move(-1,1)">↞ DASH</button><button class="move" onclick="move(1,1)">DASH ↠</button></div><div class="hint">2.4 모션: 체중 이동 → 몸통/어깨 회전 → 팔꿈치 → 주먹 · 방어/피격 연동</div><button class="btn" style="min-height:36px" onclick="quit()">경기 나가기</button></main>`;last=performance.now();acc=cpuAcc=regen=0;requestAnimationFrame(loop)}
function status(t){let x=$('status');if(x)x.textContent=t}function dist(){return Math.abs(s.ex-s.px)}function upd(){if(!$('php'))return;$('php').style.width=s.php+'%';$('ehp').style.width=s.ehp+'%';$('pst').style.width=s.pst+'%';$('est').style.width=s.est+'%';$('timer').textContent=Math.floor(s.time/60)+':'+String(Math.max(0,s.time)%60).padStart(2,'0');$('player').style.left=s.px+'%';$('enemy').style.left=s.ex+'%'}
function anim(id,t){let p=$(id);p.classList.remove('attack','jab','straight','hook','upper');void p.offsetWidth;p.classList.add('attack',t);setTimeout(()=>p.classList.remove('attack',t),580)}
function dmg(target,n,crit=false){let e=document.createElement('div');e.className='damage';e.textContent=(crit?'CRIT ':'')+'-'+n;e.style.left=(target=='e'?s.ex:s.px)+'%';e.style.top='42%';$('ring').appendChild(e);setTimeout(()=>e.remove(),730)}
function atk(t){if(!s.running)return;let a=A[t],now=performance.now(),cd=Math.max(160,a.cd*(1.15-s.speed/150));if(now-s.last<cd)return status('아직 공격이 준비되지 않았습니다');if(s.pst<a.c)return status('스태미나 부족!');s.last=now;s.pst-=a.c;anim('player',t);if(dist()>a.r){s.combo=0;return status(t.toUpperCase()+'! 빗나갔습니다 — 거리가 멉니다')}if(Math.random()<.08+s.est/1100){s.combo=0;return status('상대가 회피했습니다!')}let n=Math.round(a.d*(.62+s.power/105)*(.78+s.weight/120)*(.55+s.pst/180)),crit=Math.random()<.07+s.power/1600;if(crit)n=Math.round(n*1.65);s.ehp=Math.max(0,s.ehp-n);s.combo=now-s.lastHit<900?s.combo+1:1;s.lastHit=now;let e=$('enemy');e.classList.add('hurt');if(crit)e.classList.add('critical');setTimeout(()=>e.classList.remove('hurt','critical'),380);dmg('e',n,crit);if(s.combo>1){let c=$('combo');c.textContent=s.combo+' HIT COMBO';c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}flash();status((crit?'🔥 CRITICAL! ':'')+t.toUpperCase()+' 적중! -'+n);if(s.ehp<=0)end(true,'KO! 상대를 쓰러뜨렸습니다.')}
function guard(){if(!s.running)return;s.guard=!s.guard;$('player').classList.toggle('guard',s.guard);status(s.guard?'🛡️ 가드 중 — 다시 누르면 해제':'가드 해제');if(s.guard)setTimeout(()=>{s.guard=false;$('player').classList.remove('guard')},1100)}
function dodge(t){if(!s.running)return;s.dodge=performance.now()+520;let p=$('player');p.classList.remove('weave','duck');void p.offsetWidth;p.classList.add(t);status(t=='weave'?'↙ 위빙!':'↓ 더킹!');setTimeout(()=>p.classList.remove(t),520)}
function parry(){if(!s.running)return;s.dodge=performance.now()+300;s.guard=true;$('player').classList.add('guard');status('⚡ 패링 준비!');setTimeout(()=>{s.guard=false;$('player').classList.remove('guard')},320)}
function move(dir,dash){if(!s.running)return;s.px=Math.max(7,Math.min(77,s.px+dir*(dash?8:3.5)*(.72+s.step/100)));status(dash?'↠ 대시 스텝!':'스텝!');upd()}
function cpu(){if(!s.running)return;let x=dist();if(x>24){s.ex+=(s.px>s.ex?1:-1)*2.4;return}if(Math.random()<.2){s.ex+=(Math.random()>.5?1:-1)*3;return}let t=['jab','straight','hook','upper'][Math.floor(Math.random()*4)],a=A[t];s.est=Math.max(0,s.est-a.c);anim('enemy',t);if(performance.now()<s.dodge)return status('✨ 상대 공격 회피!');if(s.guard){if(Math.random()<.7){let n=Math.round(4+s.power*.07);s.ehp=Math.max(0,s.ehp-n);dmg('e',n);status('⚡ 패링 성공! 반격 -'+n)}else{let n=Math.max(1,Math.round(a.d*.5*(1-s.tough/180)));s.php=Math.max(0,s.php-n);dmg('p',n);status('가드했지만 충격! -'+n)}return}let n=Math.round(a.d*(.75+Math.random()*.35)*(1.05-s.tough/220));s.php=Math.max(0,s.php-n);$('player').classList.add('hurt');setTimeout(()=>$('player').classList.remove('hurt'),380);dmg('p',n);status('상대 '+t.toUpperCase()+'! -'+n);flash();if(s.php<=0)end(false,'KO! 체력이 모두 소진되었습니다.')}
function flash(){let f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}function end(win,msg){if(!s.running)return;s.running=false;$('result').classList.remove('hidden');$('rt').textContent=win?'VICTORY':'DEFEAT';$('rx').textContent=msg;upd()}function quit(){s.running=false;home()}
let last=0,acc=0,cpuAcc=0,regen=0;function loop(ts){if(!s.running)return;let dt=(ts-last)/1000;last=ts;acc+=dt;cpuAcc+=dt;regen+=dt;if(acc>=1){s.time--;acc=0;if(s.time<=0)return end(s.php>s.ehp,'3라운드 종료 — 판정으로 경기가 끝났습니다.')}if(regen>=.25){regen=0;s.pst=Math.min(100,s.pst+1.8);s.est=Math.min(100,s.est+1.5)}if(cpuAcc>1+Math.random()*.6){cpuAcc=0;cpu()}upd();requestAnimationFrame(loop)}home();
