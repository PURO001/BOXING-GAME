<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BOXING GAME 3.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#070b12;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}
button{font:inherit;color:inherit;border:0}
#app{height:100%;max-width:900px;margin:auto;position:relative}
.screen{height:100%;padding:18px 18px 22px;display:flex;flex-direction:column}
.hidden{display:none!important}
.home{justify-content:center;gap:18px;background:radial-gradient(circle at 50% 25%,#182538 0,#0b1018 46%,#05080d 100%)}
.brand{font-weight:900;letter-spacing:4px;font-size:clamp(32px,8vw,64px);text-align:center}
.sub{text-align:center;color:#aab6c7;font-size:17px}
.badge{align-self:flex-end;border:2px solid #3a4a5e;border-radius:999px;padding:7px 15px;color:#aeb9c8}
.logo{text-align:center;font-weight:900;font-size:clamp(48px,13vw,96px);letter-spacing:3px}
.logo span{font-size:.55em}
.big{height:72px;border-radius:18px;font-size:24px;font-weight:800;background:#ff4d55;box-shadow:0 7px 0 #b52d35}
.secondary{height:66px;border-radius:18px;font-size:21px;font-weight:750;background:#172538;border:2px solid #33445a}
.note{text-align:center;color:#8795a8;line-height:1.7}
#fight{padding:10px 12px 14px;gap:8px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.name{font-size:14px;color:#9eacbe}
.hp{height:18px;background:#202c3b;border-radius:99px;border:2px solid #3a4b60;overflow:hidden;margin-top:5px}
.hp i{display:block;height:100%;background:#38d18c;width:100%;transition:width .15s}
.stam i{background:#f5c64a}
.timer{text-align:center;font-size:42px;font-weight:900;line-height:.9}
.round{text-align:center;color:#99a7b9;letter-spacing:3px;font-size:13px;margin-top:8px}
#arena{flex:1;min-height:300px;border:2px solid #334358;border-radius:24px;overflow:hidden;background:linear-gradient(#253244,#1a2432 52%,#0d141e);position:relative}
canvas{display:block;width:100%;height:100%}
.msg{text-align:center;color:#b8c4d3;font-size:17px;min-height:25px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.controls button{height:57px;border-radius:14px;background:#692d35;border:2px solid #3c526c;font-weight:800;font-size:15px}
.controls button.def{background:#1d426b}
.controls button.move{background:#25352f}
.controls button.parry{background:#604b1f}
.controls button:active{transform:scale(.96)}
.exit{height:50px;border-radius:15px;background:#1b2939;border:2px solid #34475d;font-weight:750}
.tip{text-align:center;color:#7e8b9b;font-size:13px}
#creator{justify-content:center;gap:14px}
.card{background:#111b28;border:1px solid #304055;border-radius:20px;padding:20px}
label{display:block;color:#aeb9c8;margin:10px 0 6px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #43536a;background:#0b1119;color:#fff;font-size:17px}
</style>
</head>
<body>
<div id="app">
<section id="home" class="screen home">
  <div class="badge">PROTOTYPE 3.0</div>
  <div class="brand">BOXING GAME</div>
  <div class="logo">🥊 <span>BOXING</span></div>
  <div class="sub">Mobile Boxing Prototype</div>
  <button class="big" id="start">경기 시작</button>
  <button class="secondary" id="make">내 복서 만들기</button>
  <div class="note">아이폰 터치 조작 · 오프라인 싱글 플레이<br>관절형 캐릭터 · 가드 · 펀치 · 회피 · 스텝 · CPU AI</div>
</section>

<section id="creator" class="screen hidden">
  <div class="brand" style="font-size:34px">MY BOXER</div>
  <div class="card">
    <label>복서 이름</label><input id="pname" value="PLAYER">
    <label>스타일</label>
    <button class="secondary" style="width:100%;height:56px" id="styleBtn">ORTHODOX · 왼손 잽 / 오른손 스트레이트</button>
  </div>
  <button class="big" id="save">저장하고 경기</button>
  <button class="secondary" id="back">뒤로</button>
</section>

<section id="fight" class="screen hidden">
  <div class="hud">
    <div><div class="name" id="pn">PLAYER</div><div class="hp"><i id="php"></i></div><div class="hp stam"><i id="pstam"></i></div></div>
    <div><div class="timer" id="time">3:00</div><div class="round">ROUND 1</div></div>
    <div style="text-align:right"><div class="name">CPU</div><div class="hp"><i id="chp"></i></div><div class="hp stam"><i id="cstam"></i></div></div>
  </div>
  <div id="arena"><canvas id="cv"></canvas></div>
  <div class="msg" id="msg">가드 자세입니다. 거리를 보고 잽을 사용하세요.</div>
  <div class="controls">
    <button data-act="jab">👊 JAB</button>
    <button data-act="cross">👊 STRAIGHT</button>
    <button data-act="hook">🥊 HOOK</button>
    <button data-act="upper">🥊 UPPER</button>
    <button class="def" data-act="guard">🛡 GUARD</button>
    <button class="def" data-act="slip">↙ WEAVE</button>
    <button class="def" data-act="duck">↓ DUCK</button>
    <button class="parry" data-act="parry">⚡ PARRY</button>
    <button class="move" data-act="left">← WALK</button>
    <button class="move" data-act="right">WALK →</button>
    <button class="move" data-act="back">≪ DASH</button>
    <button class="move" data-act="forward">DASH ≫</button>
  </div>
  <div class="tip">공격은 거리 안에서 적중 · 스태미나가 낮으면 공격력이 감소합니다</div>
  <button class="exit" id="exit">경기 나가기</button>
</section>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const home=$("#home"), creator=$("#creator"), fight=$("#fight");
$("#start").onclick=()=>startGame();
$("#make").onclick=()=>{home.classList.add("hidden");creator.classList.remove("hidden")};
$("#back").onclick=()=>{creator.classList.add("hidden");home.classList.remove("hidden")};
$("#save").onclick=()=>{localStorage.boxerName=$("#pname").value||"PLAYER";startGame()};
$("#exit").onclick=()=>{stopGame();fight.classList.add("hidden");home.classList.remove("hidden")};
$("#styleBtn").onclick=()=>{};

const cv=$("#cv"),ctx=cv.getContext("2d");
let W,H,dpr,raf,last=0,game=null;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=cv.clientWidth; H=cv.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function lerp(a,b,t){return a+(b-a)*t}
function pt(x,y,len,ang){return{x:x+Math.cos(ang)*len,y:y+Math.sin(ang)*len}}

function makeFighter(x,flip,name){
 return {x,baseX:x,flip,name,hp:100,stam:100,state:"guard",action:null,t:0,
  headTilt:0,bodyLean:0,hitFlash:0,guard:1,walk:0,vy:0};
}
function startGame(){
 home.classList.add("hidden");creator.classList.add("hidden");fight.classList.remove("hidden");
 $("#pn").textContent=localStorage.boxerName||"PLAYER"; resize();
 game={running:true,time:180,player:makeFighter(W*.31,false,"PLAYER"),cpu:makeFighter(W*.69,true,"CPU"),lastCpu:0};
 last=performance.now(); requestAnimationFrame(loop);
}
function stopGame(){if(game)game.running=false;game=null}

function setAction(f,a,dur=.34){
 if(f.action && f.t<.08)return;
 f.action=a;f.t=dur;f.state=a;f.guard=0;
}
function act(a){
 if(!game)return; let p=game.player,c=game.cpu;
 if(a==="guard"){p.action=null;p.state="guard";p.guard=1;return}
 if(a==="slip"){setAction(p,"slip",.30);return}
 if(a==="duck"){setAction(p,"duck",.34);return}
 if(a==="parry"){setAction(p,"parry",.26);return}
 if(["jab","cross","hook","upper"].includes(a)){
   if(p.stam<9)return;
   p.stam-=a==="jab"?8:12;setAction(p,a,a==="hook"?0.48:.38);
   setTimeout(()=>hitCheck(a),100);
   return;
 }
 let step=a==="left"?-18:a==="right"?18:a==="back"?-42:42;
 p.x=clamp(p.x+step,100,W-100);p.walk=.25;
}
function hitCheck(a){
 if(!game||!game.running)return;
 const p=game.player,c=game.cpu,dist=Math.abs(p.x-c.x);
 const reach={jab:170,cross:185,hook:125,upper:105}[a];
 if(dist>reach)return;
 let dmg={jab:8,cross:14,hook:12,upper:13}[a];
 if(c.guard) dmg*=.35;
 if(c.state==="slip"||c.state==="duck") dmg*=.15;
 if(c.state==="parry"){p.hp-=5;$("#msg").textContent="PARRY! CPU가 공격을 흘렸습니다.";return}
 c.hp=clamp(c.hp-dmg,0,100);c.hitFlash=.18;
 $("#msg").textContent=a.toUpperCase()+" 적중! -"+Math.round(dmg);
 if(c.hp<=0)finish("PLAYER 승리!");
}
function cpuAI(dt){
 let c=game.cpu,p=game.player;
 c.stam=clamp(c.stam+dt*12,0,100);
 const dist=Math.abs(c.x-p.x);
 if(c.action){c.t-=dt;if(c.t<=0){c.action=null;c.state="guard";c.guard=1}return}
 if(dist>185){c.x+=c.x<p.x?25*dt:-25*dt;c.state="guard";c.guard=1;return}
 if(Math.random()<dt*.9){
   if(p.action && Math.random()<.45){setAction(c,["slip","duck","guard"][Math.floor(Math.random()*3)],.28);return}
   const a=Math.random()<.52?"jab":Math.random()<.5?"cross":"hook";
   if(c.stam>10){c.stam-=a==="jab"?8:12;setAction(c,a,.38);setTimeout(()=>cpuHit(a),100)}
 }
}
function cpuHit(a){
 if(!game||!game.running)return;
 const c=game.cpu,p=game.player,dist=Math.abs(c.x-p.x);
 if(dist>{jab:170,cross:185,hook:125,upper:105}[a])return;
 let dmg={jab:7,cross:12,hook:10,upper:11}[a];
 if(p.guard)dmg*=.35;
 if(["slip","duck"].includes(p.state))dmg*=.15;
 if(p.state==="parry"){c.hp-=4;return}
 p.hp=clamp(p.hp-dmg,0,100);p.hitFlash=.18;
 $("#msg").textContent="CPU "+a.toUpperCase()+" 적중! -"+Math.round(dmg);
 if(p.hp<=0)finish("CPU 승리!");
}
function finish(text){game.running=false;$("#msg").textContent=text+"  경기 종료";setTimeout(()=>{},0)}

$$("[data-act]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();act(b.dataset.act)}));

function loop(now){
 if(!game||!game.running)return;
 const dt=Math.min(.033,(now-last)/1000);last=now;
 game.time=Math.max(0,game.time-dt);
 if(game.time<=0){finish(game.player.hp>=game.cpu.hp?"PLAYER 판정승!":"CPU 판정승!")}
 game.player.stam=clamp(game.player.stam+dt*15,0,100);
 cpuAI(dt);updateF(game.player,dt);updateF(game.cpu,dt);draw();
 updateHud();
 raf=requestAnimationFrame(loop);
}
function updateF(f,dt){
 if(f.hitFlash>0)f.hitFlash-=dt;
 if(f.action){f.t-=dt;if(f.t<=0){f.action=null;f.state="guard";f.guard=1}}
 f.walk=Math.max(0,f.walk-dt);
}
function updateHud(){
 $("#php").style.width=game.player.hp+"%";$("#chp").style.width=game.cpu.hp+"%";
 $("#pstam").style.width=game.player.stam+"%";$("#cstam").style.width=game.cpu.stam+"%";
 let s=Math.ceil(game.time),m=Math.floor(s/60),sec=String(s%60).padStart(2,"0");$("#time").textContent=m+":"+sec;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // ring
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#344255");g.addColorStop(.55,"#1d2938");g.addColorStop(1,"#0c131d");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#aeb8c4";ctx.lineWidth=5;
 [H*.38,H*.53,H*.68].forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()});
 ctx.fillStyle="#101923";ctx.fillRect(0,H*.70,W,H*.30);
 drawFighter(game.player,game.cpu.x);
 drawFighter(game.cpu,game.player.x);
}
function drawFighter(f,targetX){
 const x=f.x,y=H*.62,flip=f.flip?-1:1;
 ctx.save(); if(f.hitFlash>0)ctx.globalAlpha=.65;
 // subtle body movement
 let lean=f.bodyLean;
 if(f.action==="slip")lean=flip*-.18;
 if(f.action==="duck")lean=flip*.03;
 if(["cross","jab","hook","upper"].includes(f.action))lean=flip*.035;
 // legs
 const hip={x:x+lean*30,y:y-45};
 ctx.strokeStyle="#b87850";ctx.lineWidth=25;ctx.lineCap="round";
 const footY=y+75;
 drawSeg(hip.x-18,hip.y+5,x-27,footY,0);
 drawSeg(hip.x+18,hip.y+5,x+27,footY,0);
 // shorts
 ctx.fillStyle="#151d29";roundRect(x-48,y-55,96,72,12);ctx.fill();
 // torso
 ctx.fillStyle=f.flip?"#c73743":"#2f78cf";roundRect(x-55,y-155,110,110,30);ctx.fill();
 // neck/head
 ctx.fillStyle="#bc7952";roundRect(x-15,y-175,30,30,8);ctx.fill();
 ctx.fillStyle="#bd7b54";ctx.beginPath();ctx.arc(x,y-205,43,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle="#211b1b";ctx.beginPath();ctx.arc(x,y-216,43,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(x-42,y-216,84,16);
 // face
 ctx.fillStyle="#202733";ctx.beginPath();ctx.arc(x+flip*15,y-207,4,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(x-flip*15,y-207,4,0,7);ctx.fill();
 ctx.strokeStyle="#5d382b";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-6,y-190);ctx.lineTo(x+6,y-190);ctx.stroke();
 // arms as articulated bones
 const shoulderF={x:x+flip*48,y:y-130}, shoulderB={x:x-flip*48,y:y-130};
 drawArm(f,"lead",shoulderF,flip,targetX);
 drawArm(f,"rear",shoulderB,flip,targetX);
 ctx.restore();
}
function drawArm(f,side,s,flip,targetX){
 const isLead=side==="lead";
 const action=f.action;
 let upperAng,foreAng,gloveDist;
 if(action==="jab" && isLead){upperAng=0;foreAng=0;gloveDist=102}
 else if(action==="cross" && !isLead){upperAng=0;foreAng=0;gloveDist=112}
 else if(action==="hook" && ((isLead)||(!isLead))){upperAng=isLead?-.75:-2.4;foreAng=isLead?-.05:-3.0;gloveDist=62}
 else if(action==="upper" && ((isLead)||(!isLead))){upperAng=1.25;foreAng=-.15;gloveDist=70}
 else {
   // authentic compact boxing guard: lead hand near face, rear hand at chin
   upperAng=isLead?1.05:2.05;
   foreAng=isLead?-1.05:-2.15;
   gloveDist=isLead?56:49;
 }
 // rear arm is slightly farther back visually
 const upperLen=52;
 let elbow=pt(s,upperLen,upperAng);
 let glove=pt(elbow,gloveDist,foreAng);
 if((action==="jab"&&isLead)||(action==="cross"&&!isLead)){
   glove.x=s.x+flip*105; glove.y=s.y+2;
   elbow.x=s.x+flip*52; elbow.y=s.y+2;
 }
 // body connection
 ctx.strokeStyle="#bc7952";ctx.lineCap="round";
 ctx.lineWidth=27;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(elbow.x,elbow.y);ctx.stroke();
 // elbow joint
 ctx.fillStyle="#c3835b";ctx.beginPath();ctx.arc(elbow.x,elbow.y,14,0,Math.PI*2);ctx.fill();
 ctx.lineWidth=25;ctx.beginPath();ctx.moveTo(elbow.x,elbow.y);ctx.lineTo(glove.x,glove.y);ctx.stroke();
 // glove
 ctx.fillStyle=isLead?"#ff4d58":"#4288ff";
 ctx.beginPath();ctx.arc(glove.x,glove.y,21,0,Math.PI*2);ctx.fill();
 // punch trail / extension cue
 if((action==="jab"&&isLead)||(action==="cross"&&!isLead)){
   ctx.strokeStyle=ctx.fillStyle;ctx.globalAlpha=.18;ctx.lineWidth=12;
   ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(glove.x,glove.y);ctx.stroke();ctx.globalAlpha=1;
 }
}
function drawSeg(x1,y1,x2,y2,rot){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

resize();
</script>
</body>
</html>
