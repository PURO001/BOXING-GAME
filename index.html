<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BOXING GAME 2.6</title>
<style>
:root{--bg:#070a0f;--muted:#9ca8b6;--red:#ef4444;--blue:#3b82f6;--gold:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;touch-action:manipulation}
#app{height:100%;display:flex;justify-content:center}.screen{width:min(100%,820px);height:100%;padding:calc(env(safe-area-inset-top)+9px) 10px calc(env(safe-area-inset-bottom)+8px);display:flex;flex-direction:column;gap:7px}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:2px}.badge{font-size:10px;color:#b9c4d0;border:1px solid #3c4755;border-radius:99px;padding:5px 8px}
.btn{min-height:47px;border-radius:13px;background:#202a36;border:1px solid #3b4654;font-weight:850}.primary{background:var(--red)!important}.secondary{background:#192536}
.home{justify-content:center}.logo{text-align:center;font-size:45px;font-weight:1000;letter-spacing:2px}.subtitle,.small,.hint{color:var(--muted);text-align:center}.menu{display:grid;gap:9px;margin-top:15px}.small{font-size:11px;line-height:1.55}
.hud{display:grid;grid-template-columns:1fr 68px 1fr;gap:7px;align-items:end}.name{font-size:10px;color:var(--muted);margin-bottom:3px}.right{text-align:right}.bar{height:13px;background:#29323d;border-radius:99px;overflow:hidden}.fill{height:100%}.hpP{background:#39cf82}.hpE{background:#ff4d52}.stamina{height:5px;margin-top:4px;background:#26303a;border-radius:99px;overflow:hidden}.stamina>div{height:100%;background:var(--gold)}.timer{text-align:center;font-size:20px;font-weight:950}.round{text-align:center;color:var(--muted);font-size:9px}
.ring{position:relative;flex:1;min-height:300px;border-radius:16px;overflow:hidden;border:1px solid #3a4653;background:linear-gradient(#202b3a 0 45%,#141b24 45%)}.lights{position:absolute;inset:0 0 55%;background:radial-gradient(ellipse at 50% 25%,#fff2,#fff0 55%)}.crowd{position:absolute;inset:14% 0 55%;opacity:.22;background:radial-gradient(circle at 10% 55%,#fff 0 2px,transparent 3px),radial-gradient(circle at 30% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 50% 60%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 90% 60%,#fff 0 2px,transparent 3px)}.floor{position:absolute;left:0;right:0;bottom:0;height:56%;background:linear-gradient(#1c2630,#10161e);transform:perspective(500px) rotateX(8deg);transform-origin:bottom}.floor:after{content:"";position:absolute;inset:15% 8% 7%;border:2px solid #b5bdc655}.ropes{position:absolute;left:0;right:0;top:45%;height:37px;border-top:3px solid #e3e7eb;border-bottom:3px solid #858e98;z-index:4}.corner{position:absolute;top:40%;width:10px;height:105px;background:#9ba3ab;z-index:5}.corner.l{left:7%}.corner.r{right:7%}

.boxer{position:absolute;bottom:12%;width:132px;height:224px;z-index:8;transition:left .14s ease,bottom .12s ease;transform-origin:center bottom}.boxer.player{left:10%}.boxer.enemy{left:67%;transform:scaleX(-1)}
.bodyGroup{position:absolute;inset:0;transform-origin:67px 128px}
.head{position:absolute;left:43px;top:0;width:50px;height:50px;border-radius:50%;background:#b87552;z-index:5}.hair{position:absolute;left:40px;top:-1px;width:56px;height:24px;background:#241b19;border-radius:28px 28px 8px 8px;z-index:7}.neck{position:absolute;left:59px;top:43px;width:17px;height:20px;background:#b87552;z-index:2}
.torso{position:absolute;left:30px;top:52px;width:76px;height:78px;border-radius:29px 29px 22px 22px;background:#2f77d0;z-index:2}.enemy .torso{background:#b82f3b}
.shoulder{position:absolute;top:54px;width:30px;height:27px;border-radius:50%;background:#2f77d0;z-index:3}.enemy .shoulder{background:#b82f3b}.shoulder.l{left:18px}.shoulder.r{left:82px}

/* 복싱 가드: 앞손은 코/눈 높이, 뒷손은 턱 아래. 팔 전체를 어깨 관절에 고정. */
.arm{position:absolute;width:20px;height:70px;border-radius:12px;background:#b87552;z-index:4;will-change:transform;transform-origin:50% 7px}
.arm.l{left:19px;top:57px;transform:rotate(-8deg)} /* 앞손: 코 앞 */
.arm.r{left:87px;top:69px;transform:rotate(-28deg)} /* 뒷손: 턱 밑 */
.glove{position:absolute;left:-6px;bottom:-12px;width:32px;height:29px;border-radius:48%;background:var(--red);box-shadow:0 3px 7px #0009}.enemy .glove{background:var(--blue)}.glove:after{content:"";position:absolute;left:4px;right:4px;top:5px;height:5px;border-radius:5px;background:#fff4}
.shorts{position:absolute;left:30px;top:124px;width:76px;height:40px;border-radius:7px;background:#252c35;z-index:3}.leg{position:absolute;top:153px;width:26px;height:58px;border-radius:15px;background:#b87552;z-index:1}.leg.l{left:36px}.leg.r{left:76px}.shoe{position:absolute;top:204px;width:37px;height:12px;border-radius:8px;background:#0c1117;z-index:2}.shoe.l{left:27px}.shoe.r{left:73px}

/* 앞손 잽: 코 앞 가드 -> 정확히 수평으로 전진 -> 즉시 회수 */
.jab .arm.l{animation:jabLead .42s cubic-bezier(.16,.84,.18,1)}
/* 뒷손 스트레이트: 턱 밑 가드 -> 수평으로 전진. 뒷발/골반 회전은 bodyGroup이 담당 */
.straight .arm.r{animation:straightRear .52s cubic-bezier(.12,.86,.16,1)}
/* 훅/어퍼도 해당 손의 가드 위치에서 시작 */
.hook .arm.l{animation:hookLead .5s cubic-bezier(.18,.78,.18,1)}
.upper .arm.r{animation:upperRear .52s cubic-bezier(.18,.8,.18,1)}
.attack .bodyGroup{animation:drive .42s ease-out}
@keyframes drive{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(3px) rotate(1deg)}52%{transform:translateX(7px) rotate(2.2deg)}}
/* 좌표계상 rotate(-90deg)가 팔을 오른쪽으로 정확히 눕힌다. */
@keyframes jabLead{0%{transform:rotate(-8deg)}22%{transform:rotate(-52deg)}46%{transform:rotate(-90deg)}66%{transform:rotate(-90deg)}100%{transform:rotate(-8deg)}}
@keyframes straightRear{0%{transform:rotate(-28deg)}20%{transform:rotate(-58deg)}46%{transform:rotate(-90deg)}69%{transform:rotate(-90deg)}100%{transform:rotate(-28deg)}}
@keyframes hookLead{0%{transform:rotate(-8deg)}28%{transform:rotate(-55deg)}52%{transform:rotate(-115deg)}70%{transform:rotate(-78deg)}100%{transform:rotate(-8deg)}}
@keyframes upperRear{0%{transform:rotate(-28deg)}23%{transform:rotate(-48deg) translateY(2px)}51%{transform:rotate(-62deg) translateY(-7px)}69%{transform:rotate(-55deg) translateY(-4px)}100%{transform:rotate(-28deg)}}
.enemy.attack .bodyGroup{animation:driveE .42s ease-out}.enemy .arm.l,.enemy .arm.r{ } 
@keyframes driveE{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-1deg)}52%{transform:translateX(-7px) rotate(-2.2deg)}}
/* enemy는 scaleX(-1)로 좌우가 반전되므로 동일한 손 역할을 사용 */
.enemy.jab .arm.l{animation:jabLead .42s cubic-bezier(.16,.84,.18,1)}.enemy.straight .arm.r{animation:straightRear .52s cubic-bezier(.12,.86,.16,1)}.enemy.hook .arm.l{animation:hookLead .5s}.enemy.upper .arm.r{animation:upperRear .52s}
.guard .arm.l{transform:rotate(-8deg)}.guard .arm.r{transform:rotate(-28deg)}
.weave{bottom:18%!important;transform:rotate(-6deg)}.enemy.weave{transform:scaleX(-1) rotate(6deg)}.duck{bottom:7%!important;transform:scaleY(.76)}.enemy.duck{transform:scaleX(-1) scaleY(.76)}
.hurt{animation:hit .36s}.critical{filter:brightness(1.35)}@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(15px) rotate(5deg)}55%{transform:translateX(-6px) rotate(-3deg)}}
.status{text-align:center;height:20px;color:#b1bac5;font-size:11px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.controls button{min-height:41px;border-radius:10px;border:1px solid #3a4654;font-size:10px;font-weight:900}.atk{background:#612b32}.def{background:#203d5f}.move{background:#28332f}.special{background:#4b3a20}.hint{font-size:9px}
.combo{position:absolute;top:8%;left:50%;font-size:20px;font-weight:1000;opacity:0;z-index:20}.combo.show{animation:combo .7s}.damage{position:absolute;z-index:21;font-weight:1000;font-size:19px;animation:damage .72s forwards;text-shadow:0 2px 6px #000}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25}.flash.on{animation:flash .13s}@keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.7)}25%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%)}}@keyframes damage{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}@keyframes flash{from{opacity:.48}to{opacity:0}}
.result{position:absolute;inset:0;z-index:30;background:#05080dcc;display:flex;align-items:center;justify-content:center}.resultBox{width:86%;padding:27px 19px;border-radius:19px;text-align:center;background:#121923;border:1px solid #3d4957}.resultBox h1{font-size:36px;margin:0 0 7px}.resultBox p{color:var(--muted);line-height:1.5}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const s={skin:'#b87552',hair:'#241b19',power:60,speed:60,step:60,tough:60,weight:70,php:100,ehp:100,pst:100,est:100,time:180,running:false,guard:false,dodge:0,px:10,ex:67,last:0,combo:0,lastHit:0};
const A={jab:{d:7,c:7,r:23,cd:280},straight:{d:10,c:9,r:26,cd:390},hook:{d:12,c:12,r:24,cd:470},upper:{d:15,c:15,r:22,cd:560}};
function home(){app.innerHTML=`<main class="screen home"><div class="top"><b class="brand">BOXING GAME</b><span class="badge">VERSION 2.6</span></div><div><div class="logo">🥊 BOXING</div><div class="subtitle">2.5D Boxing Guard & Punch Prototype</div></div><div class="menu"><button class="btn primary" onclick="fight()">경기 시작</button><button class="btn secondary" onclick="custom()">내 복서 만들기</button></div><div class="small">2.6 · 복싱 가드 자세 · 앞손 잽 · 뒷손 스트레이트<br>어깨 관절 고정 · 수평 직선 펀치 · 기본 가드 복귀</div></main>`}
function custom(){app.innerHTML=`<main class="screen"><div class="top"><b>MY BOXER</b><button class="btn" style="min-height:36px;padding:0 12px" onclick="home()">뒤로</button></div><div style="height:145px;display:flex;justify-content:center;align-items:flex-end;background:linear-gradient(#16202c,#0d1218);border-radius:15px;overflow:hidden">${fighter('preview')}</div><section style="padding:14px;background:#121923;border:1px solid #394654;border-radius:16px"><div style="font-size:12px;color:#9ca8b6;line-height:1.5;margin-bottom:8px">기본 자세는 복싱 가드입니다: 왼손은 코 앞, 오른손은 턱 아래. 실제 경기에서는 잽=왼손, 스트레이트=오른손으로 작동합니다.</div>${[['power','주먹 파워'],['speed','주먹 속도'],['step','스텝 속도'],['tough','맷집']].map(x=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${x[1]}</span><b>${s[x[0]]}</b></div><input style="width:100%;accent-color:#ef4444" type="range" min="0" max="100" value="${s[x[0]]}" oninput="s['${x[0]}']=+this.value;custom()"></div>`).join('')}</section><button class="btn primary" onclick="fight()">이 복서로 경기하기</button></main>`}
function fighter(id,e=false){return `<div id="${id}" class="boxer ${e?'enemy':''}" style="${id=='preview'?'position:relative;left:auto;bottom:auto;transform:scale(.63)':''}"><div class="bodyGroup"><div class="hair" ${e?'':'style="background:'+s.hair+'"'}></div><div class="head" ${e?'':'style="background:'+s.skin+'"'}></div><div class="neck" ${e?'':'style="background:'+s.skin+'"'}></div><div class="torso"></div><div class="shoulder l"></div><div class="shoulder r"></div><div class="arm l" ${e?'':'style="background:'+s.skin+'"'}><div class="glove"></div></div><div class="arm r" ${e?'':'style="background:'+s.skin+'"'}><div class="glove"></div></div><div class="shorts"></div><div class="leg l" ${e?'':'style="background:'+s.skin+'"'}></div><div class="leg r" ${e?'':'style="background:'+s.skin+'"'}></div><div class="shoe l"></div><div class="shoe r"></div></div></div>`}
function fight(){Object.assign(s,{php:100,ehp:100,pst:100,est:100,time:180,running:true,guard:false,dodge:0,px:10,ex:67,last:0,combo:0,lastHit:0});app.innerHTML=`<main class="screen"><div class="hud"><div><div class="name">PLAYER</div><div class="bar"><div id="php" class="fill hpP"></div></div><div class="stamina"><div id="pst"></div></div></div><div><div id="timer" class="timer">3:00</div><div class="round">ROUND 1</div></div><div><div class="name right">CPU</div><div class="bar"><div id="ehp" class="fill hpE"></div></div><div class="stamina"><div id="est"></div></div></div></div><div id="ring" class="ring"><div class="lights"></div><div class="crowd"></div><div class="floor"></div><div class="ropes"></div><div class="corner l"></div><div class="corner r"></div>${fighter('player')}${fighter('enemy',true)}<div id="combo" class="combo"></div><div id="flash" class="flash"></div><div id="result" class="result hidden"><div class="resultBox"><h1 id="rt"></h1><p id="rx"></p><button class="btn primary" onclick="home()">메인으로</button></div></div></div><div id="status" class="status">기본 복싱 가드 · 왼손은 코 앞 / 오른손은 턱 밑</div><div class="controls"><button class="atk" onclick="atk('jab')">👊 왼손 JAB</button><button class="atk" onclick="atk('straight')">👊 오른손 STRAIGHT</button><button class="atk" onclick="atk('hook')">🥊 왼손 HOOK</button><button class="atk" onclick="atk('upper')">🥊 오른손 UPPER</button><button class="def" onclick="guard()">🛡️ GUARD</button><button class="def" onclick="dodge('weave')">↙ WEAVE</button><button class="def" onclick="dodge('duck')">↓ DUCK</button><button class="special" onclick="parry()">⚡ PARRY</button><button class="move" onclick="move(-1,0)">← WALK</button><button class="move" onclick="move(1,0)">WALK →</button><button class="move" onclick="move(-1,1)">↞ DASH</button><button class="move" onclick="move(1,1)">DASH ↠</button></div><div class="hint">2.6: 기본 가드에서 시작 · JAB은 왼손, STRAIGHT는 오른손 · 두 펀치 모두 어깨에서 시작해 수평으로 뻗고 다시 가드 위치로 돌아옵니다.</div><button class="btn" style="min-height:35px" onclick="quit()">경기 나가기</button></main>`;last=performance.now();acc=cpuAcc=regen=0;requestAnimationFrame(loop)}
function status(t){let x=$('status');if(x)x.textContent=t}function dist(){return Math.abs(s.ex-s.px)}function upd(){if(!$('php'))return;$('php').style.width=s.php+'%';$('ehp').style.width=s.ehp+'%';$('pst').style.width=s.pst+'%';$('est').style.width=s.est+'%';$('timer').textContent=Math.floor(s.time/60)+':'+String(Math.max(0,s.time)%60).padStart(2,'0');$('player').style.left=s.px+'%';$('enemy').style.left=s.ex+'%'}
function anim(id,t){let p=$(id);p.classList.remove('attack','jab','straight','hook','upper');void p.offsetWidth;p.classList.add('attack',t);setTimeout(()=>p.classList.remove('attack',t),600)}
function dmg(target,n,crit=false){let e=document.createElement('div');e.className='damage';e.textContent=(crit?'CRIT ':'')+'-'+n;e.style.left=(target=='e'?s.ex:s.px)+'%';e.style.top='42%';$('ring').appendChild(e);setTimeout(()=>e.remove(),730)}
function atk(t){if(!s.running)return;let a=A[t],now=performance.now(),cd=Math.max(160,a.cd*(1.15-s.speed/150));if(now-s.last<cd)return status('아직 공격이 준비되지 않았습니다');if(s.pst<a.c)return status('스태미나 부족!');s.last=now;s.pst-=a.c;anim('player',t);if(dist()>a.r){s.combo=0;return status(t=='jab'?'왼손 잽 — 거리가 멉니다':'오른손 스트레이트 — 거리가 멉니다')}if(Math.random()<.08+s.est/1100){s.combo=0;return status('상대가 회피했습니다!')}let n=Math.round(a.d*(.62+s.power/105)*(.78+s.weight/120)*(.55+s.pst/180)),crit=Math.random()<.07+s.power/1600;if(crit)n=Math.round(n*1.65);s.ehp=Math.max(0,s.ehp-n);s.combo=now-s.lastHit<900?s.combo+1:1;s.lastHit=now;let e=$('enemy');e.classList.add('hurt');if(crit)e.classList.add('critical');setTimeout(()=>e.classList.remove('hurt','critical'),380);dmg('e',n,crit);if(s.combo>1){let c=$('combo');c.textContent=s.combo+' HIT COMBO';c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}flash();status((t=='jab'?'👊 LEFT JAB':'👊 RIGHT STRAIGHT')+(crit?' 🔥 CRITICAL':'')+' 적중! -'+n);if(s.ehp<=0)end(true,'KO! 상대를 쓰러뜨렸습니다.')}
function guard(){if(!s.running)return;s.guard=!s.guard;$('player').classList.toggle('guard',s.guard);status(s.guard?'🛡️ 가드 중 — 왼손은 코 앞, 오른손은 턱 밑':'가드 해제');if(s.guard)setTimeout(()=>{s.guard=false;$('player').classList.remove('guard')},1100)}
function dodge(t){if(!s.running)return;s.dodge=performance.now()+520;let p=$('player');p.classList.remove('weave','duck');void p.offsetWidth;p.classList.add(t);status(t=='weave'?'↙ 위빙!':'↓ 더킹!');setTimeout(()=>p.classList.remove(t),520)}
function parry(){if(!s.running)return;s.dodge=performance.now()+300;s.guard=true;$('player').classList.add('guard');status('⚡ 패링 준비!');setTimeout(()=>{s.guard=false;$('player').classList.remove('guard')},320)}
function move(dir,dash){if(!s.running)return;s.px=Math.max(6,Math.min(78,s.px+dir*(dash?8:3.5)*(.72+s.step/100)));status(dash?'↠ 대시 스텝!':'스텝!');upd()}
function cpu(){if(!s.running)return;let x=dist();if(x>26){s.ex+=(s.px>s.ex?1:-1)*2.4;return}if(Math.random()<.2){s.ex+=(Math.random()>.5?1:-1)*3;return}let t=['jab','straight','hook','upper'][Math.floor(Math.random()*4)],a=A[t];s.est=Math.max(0,s.est-a.c);anim('enemy',t);if(performance.now()<s.dodge)return status('✨ 상대 공격 회피!');if(s.guard){if(Math.random()<.7){let n=Math.round(4+s.power*.07);s.ehp=Math.max(0,s.ehp-n);dmg('e',n);status('⚡ 패링 성공! 반격 -'+n)}else{let n=Math.max(1,Math.round(a.d*.5*(1-s.tough/180)));s.php=Math.max(0,s.php-n);dmg('p',n);status('가드했지만 충격! -'+n)}return}let n=Math.round(a.d*(.75+Math.random()*.35)*(1.05-s.tough/220));s.php=Math.max(0,s.php-n);$('player').classList.add('hurt');setTimeout(()=>$('player').classList.remove('hurt'),380);dmg('p',n);status('상대 '+t.toUpperCase()+'! -'+n);flash();if(s.php<=0)end(false,'KO! 체력이 모두 소진되었습니다.')}
function flash(){let f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}function end(win,msg){if(!s.running)return;s.running=false;$('result').classList.remove('hidden');$('rt').textContent=win?'VICTORY':'DEFEAT';$('rx').textContent=msg;upd()}function quit(){s.running=false;home()}
let last=0,acc=0,cpuAcc=0,regen=0;function loop(ts){if(!s.running)return;let dt=(ts-last)/1000;last=ts;acc+=dt;cpuAcc+=dt;regen+=dt;if(acc>=1){s.time--;acc=0;if(s.time<=0)return end(s.php>s.ehp,'3라운드 종료 — 판정으로 경기가 끝났습니다.')}if(regen>=.25){regen=0;s.pst=Math.min(100,s.pst+1.8);s.est=Math.min(100,s.est+1.5)}if(cpuAcc>1+Math.random()*.6){cpuAcc=0;cpu()}upd();requestAnimationFrame(loop)}home();
</script>
</body></html>
