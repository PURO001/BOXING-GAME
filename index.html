<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOXING GAME</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#05080d;color:#f5f7fb;font-family:Arial,'Noto Sans KR',sans-serif}body{overflow-x:hidden}button{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 50% 20%,rgba(45,70,105,.22),transparent 35%),linear-gradient(#101a29 0 13%,#070b11 42%,#05080d 100%)}
.top{padding:12px 14px 8px;display:grid;grid-template-columns:1fr 130px 1fr;gap:10px;align-items:center;border-bottom:1px solid #172231}.card{display:flex;align-items:center;gap:9px;min-width:0}.card.right{justify-content:flex-end}.portrait{width:56px;height:56px;border:2px solid #d9dfe7;border-radius:8px;background:#202a38;position:relative;overflow:hidden;flex:none}.face{position:absolute;width:28px;height:34px;border-radius:45%;background:#c98961;left:13px;top:11px}.hair{position:absolute;width:32px;height:16px;background:#11151a;border-radius:55% 55% 35% 35%;left:11px;top:6px}.eye{position:absolute;width:4px;height:3px;border-radius:50%;background:#111;top:27px}.eye.l{left:19px}.eye.r{left:31px}.name{font-weight:800;font-size:18px}.bar{height:10px;border:1px solid #66717f;border-radius:8px;background:#202b38;overflow:hidden;margin-top:5px}.hp{height:100%;background:#20d26f;width:100%}.right .hp{background:#ff454b}.stam{height:8px;border-radius:5px;background:#238ce8;margin-top:5px;width:100%}.timer{text-align:center}.round{font-size:15px;font-weight:800;letter-spacing:2px}.time{font-size:34px;font-weight:900;line-height:1.05}.stage{margin:auto;max-width:1120px;padding:14px 10px 0}.ring{height:min(55vw,560px);min-height:300px;position:relative;border:1px solid #29384a;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 25%,rgba(66,84,112,.55),transparent 30%),linear-gradient(180deg,#172436,#0c1420 55%,#09101a)}.audience{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(190,200,215,.45) 0 3px,transparent 4px);background-size:150px 65px;opacity:.45}.rope{position:absolute;left:0;right:0;height:5px;background:#e8edf3;box-shadow:0 0 0 1px #536170}.r1{top:34%}.r2{top:50%}.r3{top:66%}.floor{position:absolute;left:5%;right:5%;bottom:0;height:31%;background:linear-gradient(#182331,#080d14);border:3px solid #303b48;border-bottom:0}.corner{position:absolute;top:35%;width:24px;height:40%;background:#aab3bd}.c1{left:8%}.c2{right:8%}
.fighter{position:absolute;width:190px;height:92%;bottom:0}.player{left:22%}.opp{right:22%;transform:scaleX(-1)}.head{position:absolute;width:58px;height:68px;background:#bd7954;border-radius:46%;top:18%;left:66px;z-index:4}.hair2{position:absolute;width:68px;height:31px;background:#151313;border-radius:45% 45% 28% 28%;top:15%;left:61px;z-index:5}.neck{position:absolute;width:25px;height:24px;background:#bd7954;top:29%;left:83px;z-index:2}.torso{position:absolute;width:100px;height:150px;background:#166bd0;border-radius:38px 38px 12px 12px;top:31%;left:45px;z-index:1}.opp .torso{background:#c92e3c}.shorts{position:absolute;width:112px;height:83px;background:#101821;border-radius:8px 8px 18px 18px;top:58%;left:39px;z-index:3}.arm{position:absolute;z-index:7}
.upper{position:absolute;width:25px;height:55px;background:#bd7954;border-radius:14px;transform-origin:top center}
.fore{position:absolute;width:24px;height:52px;background:#bd7954;border-radius:14px;transform-origin:top center}
.elbow{position:absolute;width:28px;height:28px;border-radius:50%;background:#bd7954;z-index:3}
.glove{position:absolute;width:40px;height:40px;border-radius:45%;background:#1269df;border:2px solid #0a3f8e;z-index:4}
.opp .glove{background:#c62e35;border-color:#7e1e26}

/* 명확한 복싱 가드: 어깨→팔꿈치→전완→주먹의 4단 구조 */
.guardL{left:108px;top:35%;width:82px;height:125px}
.guardL .upper{left:0;top:0;transform:rotate(38deg)}
.guardL .elbow{left:38px;top:39px}
.guardL .fore{left:42px;top:29px;transform:rotate(-42deg)}
.guardL .glove{left:34px;top:0}

.guardR{left:66px;top:36%;width:80px;height:125px}
.guardR .upper{left:0;top:0;transform:rotate(-38deg)}
.guardR .elbow{left:17px;top:39px}
.guardR .fore{left:10px;top:29px;transform:rotate(43deg)}
.guardR .glove{left:26px;top:0}

/* 주먹을 팔 전체가 아닌 관절 단위로 앞으로 보내므로 몸통과 분리되지 않음 */
.guardL.jab .upper{animation:leadUpper .34s ease-out}
.guardL.jab .fore{animation:leadFore .34s ease-out}
.guardL.jab .glove{animation:leadGlove .34s ease-out}
.guardR.straight .upper{animation:rearUpper .38s ease-out}
.guardR.straight .fore{animation:rearFore .38s ease-out}
.guardR.straight .glove{animation:rearGlove .38s ease-out}
@keyframes leadUpper{50%{transform:rotate(18deg)}}
@keyframes leadFore{50%{transform:rotate(0deg) translateX(24px)}}
@keyframes leadGlove{50%{transform:translateX(48px)}}
@keyframes rearUpper{50%{transform:rotate(-15deg)}}
@keyframes rearFore{50%{transform:rotate(8deg) translateX(30px)}}
@keyframes rearGlove{50%{transform:translateX(58px)}}

.leg{position:absolute;width:28px;height:98px;background:#bd7954;border-radius:15px;top:70%;z-index:2}.leg.l{left:58px;transform:rotate(4deg)}.leg.r{left:108px;transform:rotate(-4deg)}.boot{position:absolute;width:40px;height:18px;background:#17202c;border-radius:8px;top:92%;z-index:2}.boot.l{left:48px}.boot.r{left:105px}
.status{text-align:center;min-height:32px;font-size:18px;font-weight:700;padding:10px 4px 6px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:1120px;margin:auto;padding:4px 10px}.controls button{border:1px solid #34475d;border-radius:12px;min-height:54px;color:#fff;font-weight:900;background:#692b34}.controls button.def{background:#17385f}.controls button.move{background:#26352f}.controls button.parry{background:#604b20}.controls button:active{transform:scale(.97)}.tip{text-align:center;color:#9aa7b8;font-size:14px;padding:11px 10px}.exit{display:block;width:calc(100% - 20px);max-width:1120px;margin:0 auto 18px;padding:15px;border-radius:16px;border:1px solid #34475d;background:#1c2938;color:#fff;font-weight:900;font-size:18px}.overlay{position:fixed;inset:0;background:rgba(3,6,10,.86);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.overlay.show{display:flex}.panel{width:min(500px,100%);background:#111b28;border:1px solid #39495c;border-radius:20px;padding:24px;text-align:center}.panel button{margin-top:12px;width:100%;padding:13px;border-radius:12px;border:0;background:#ff4b51;color:white;font-weight:900}@media(max-width:600px){.top{grid-template-columns:1fr 92px 1fr}.portrait{width:44px;height:44px}.name{font-size:13px}.time{font-size:28px}.round{font-size:12px}.ring{height:56vh;min-height:390px}.fighter{transform:scale(.82);transform-origin:bottom center}.opp{transform:scaleX(-1) scale(.82)}.player{left:10%}.opp{right:10%}.controls{gap:6px;padding:4px 8px}.controls button{min-height:57px;font-size:12px}.tip{font-size:12px}}
</style></head><body><div class="app"><header class="top"><div class="card"><div class="portrait"><div class="hair"></div><div class="face"></div><i class="eye l"></i><i class="eye r"></i></div><div style="flex:1"><div class="name">PLAYER</div><div class="bar"><div id="php" class="hp"></div></div><div class="stam"></div></div></div><div class="timer"><div class="round">ROUND 1</div><div id="timer" class="time">02:55</div></div><div class="card right"><div style="flex:1"><div class="name" style="text-align:right">OPPONENT</div><div class="bar"><div id="ohp" class="hp"></div></div><div class="stam"></div></div><div class="portrait"><div class="hair"></div><div class="face"></div><i class="eye l"></i><i class="eye r"></i></div></div></header><main class="stage"><div class="ring"><div class="audience"></div><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div class="floor"></div><div class="corner c1"></div><div class="corner c2"></div><div class="fighter player" id="player"><div class="hair2"></div><div class="head"></div><div class="neck"></div><div class="torso"></div><div class="shorts"></div><div class="arm guardL" id="leftArm"><div class="upper"></div><div class="elbow"></div><div class="fore"></div><div class="glove"></div></div><div class="arm guardR" id="rightArm"><div class="upper"></div><div class="elbow"></div><div class="fore"></div><div class="glove"></div></div><div class="leg l"></div><div class="leg r"></div><div class="boot l"></div><div class="boot r"></div></div><div class="fighter opp"><div class="hair2"></div><div class="head"></div><div class="neck"></div><div class="torso"></div><div class="shorts"></div><div class="arm guardL"><div class="upper"></div><div class="elbow"></div><div class="fore"></div><div class="glove"></div></div><div class="arm guardR"><div class="upper"></div><div class="elbow"></div><div class="fore"></div><div class="glove"></div></div><div class="leg l"></div><div class="leg r"></div><div class="boot l"></div><div class="boot r"></div></div></div><div id="status" class="status">기본 가드 자세 — 얼굴과 턱을 보호하세요</div><div class="controls"><button onclick="attack('jab')">🥊 JAB<br><small>왼손 잽</small></button><button onclick="attack('straight')">🥊 STRAIGHT<br><small>오른손</small></button><button onclick="move('HOOK')">🥊 HOOK<br><small>좌우 훅</small></button><button onclick="move('UPPER')">🥊 UPPER<br><small>어퍼컷</small></button><button class="def" onclick="guard()">🛡️ GUARD</button><button class="def" onclick="move('WEAVE')">↙ WEAVE</button><button class="def" onclick="move('DUCK')">↓ DUCK</button><button class="parry" onclick="move('PARRY')">⚡ PARRY</button><button class="move" onclick="move('← WALK')">← WALK</button><button class="move" onclick="move('WALK →')">WALK →</button><button class="move" onclick="move('⇐ DASH')">⇐ DASH</button><button class="move" onclick="move('DASH ⇒')">DASH ⇒</button></div><div class="tip">공격은 거리 안에서 적중 · 스태미나가 부족하면 공격이 약해집니다</div><button class="exit" onclick="document.getElementById('modal').classList.add('show')">경기 나가기</button></main></div><div id="modal" class="overlay"><div class="panel"><h2>경기를 종료하시겠습니까?</h2><p>현재 프로토타입에서는 메뉴 화면으로 돌아갑니다.</p><button onclick="location.reload()">메뉴로 돌아가기</button><button style="background:#273548" onclick="document.getElementById('modal').classList.remove('show')">계속하기</button></div></div><script>let hp=100,time=175,busy=false;const s=document.getElementById('status');function attack(t){if(busy)return;busy=true;const a=document.getElementById(t==='jab'?'leftArm':'rightArm');a.classList.remove('jab','straight');void a.offsetWidth;a.classList.add(t);let d=t==='jab'?10:19;hp=Math.max(0,hp-d);document.getElementById('ohp').style.width=hp+'%';s.textContent=t==='jab'?'JAB 적중! 왼손이 가드 위치에서 직선으로 뻗습니다':'STRAIGHT 적중! 오른손이 턱 옆에서 직선으로 뻗습니다';setTimeout(()=>{a.classList.remove('jab','straight');busy=false},420)}function guard(){s.textContent='GUARD — 양손을 얼굴과 턱 주변으로 복귀했습니다'}function move(t){s.textContent=t+' — 동작을 실행했습니다'}setInterval(()=>{if(time<=0)return;time--;timer.textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0')},1000)</script></body></html>
